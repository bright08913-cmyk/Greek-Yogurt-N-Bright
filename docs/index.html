<link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF6F1; --card:#FFFFFF; --ink:#4B3A4F; --muted:#76667A; --line:#EADCE0;
    --pink:#FF8FAB; --pink-dark:#C93C63; --soft:#FFE3EA; --mint:#BFEBD5; --danger:#C0284F; --ok:#2E9E6A;
    --shadow:0 4px 0 #4B3A4F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Mali,'IBM Plex Sans Thai',system-ui,sans-serif}
  body{padding-bottom:110px}
  button,input,textarea{font:inherit;color:inherit}
  .h{font-family:Itim,Mali,sans-serif;font-weight:400}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px}
  .sub{color:var(--muted);font-size:14px}

  /* header */
  .top{padding:22px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:8px;font-size:26px}
  .pill{font-size:12px;font-weight:600;background:#fff;border:2px solid var(--ink);padding:4px 10px;border-radius:999px;white-space:nowrap}
  h1.hello{margin:12px 0 2px;font-size:30px;line-height:1.2}
  .demo{font-size:12px;background:#FFF1C7;padding:4px 10px;border-radius:8px;display:inline-block;margin-top:8px}
  .closed{background:#FFF1C7;border:2px solid var(--ink);border-radius:18px;padding:14px;margin-top:14px;text-align:center;font-weight:600}

  /* menu grid */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
  .menu{background:var(--card);border:2.5px solid var(--ink);border-radius:24px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;
        box-shadow:var(--shadow);position:relative;text-align:left;cursor:pointer;transition:transform .1s,box-shadow .1s}
  .menu:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .menu:disabled{opacity:.5;cursor:not-allowed}
  .menu.in-cart{background:#FFF8FA}
  .menu .art{height:104px;border-radius:18px;display:flex;align-items:center;justify-content:center}
  .menu .nm{font-size:19px;margin-top:6px}
  .menu .ds{font-size:12px;color:var(--muted);min-height:18px}
  .prow{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
  .menu .pr{font-size:21px;color:var(--pink-dark)}
  .plus{width:30px;height:30px;border-radius:15px;background:var(--pink);border:2px solid var(--ink);font-size:20px;line-height:25px;text-align:center;font-weight:600}
  .badge{position:absolute;top:-8px;right:-8px;background:var(--pink);border:2px solid var(--ink);font-size:13px;font-weight:600;min-width:28px;height:28px;
         border-radius:14px;display:flex;align-items:center;justify-content:center;padding:0 7px;z-index:1}

  /* buttons */
  .bar{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(18px + env(safe-area-inset-bottom));
       background:linear-gradient(to top,var(--bg) 75%,rgba(255,246,241,0));z-index:5}
  .maxw{max-width:560px;margin:0 auto}
  .btn{width:100%;border:2.5px solid var(--ink);border-radius:22px;padding:14px 18px;font-family:Itim,Mali,sans-serif;font-size:19px;
       background:var(--pink);color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;
       box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .btn:disabled{background:#EADCE0;cursor:not-allowed}
  .btn.center{justify-content:center}
  .btn.soft{background:#fff;box-shadow:0 3px 0 var(--ink);justify-content:center;font-family:Mali,sans-serif;font-weight:600;font-size:15px;min-height:48px;padding:10px;border-width:2px}
  .icon-btn{width:44px;height:44px;border-radius:22px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
            box-shadow:0 3px 0 var(--ink);cursor:pointer;flex:none}

  /* sheets */
  .overlay{position:fixed;inset:0;background:rgba(75,58,79,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;border-top:2.5px solid var(--ink);max-height:94vh;overflow:auto;
         transform:translateY(105%);visibility:hidden;transition:transform .34s cubic-bezier(.2,1.2,.3,1),visibility 0s .34s;z-index:11}
  .sheet.show{transform:translateY(0);visibility:visible;transition:transform .34s cubic-bezier(.2,1.2,.3,1)}
  .sheet .inner{max-width:560px;margin:0 auto;padding:0 20px 120px}
  .sheet-bar{position:sticky;bottom:0;padding:12px 0 calc(14px + env(safe-area-inset-bottom));background:var(--bg);margin-top:14px}

  .hero{margin:0 -20px;height:250px;border-radius:0 0 32px 32px;border-bottom:2.5px solid var(--ink);display:flex;align-items:flex-end;justify-content:center;position:relative}
  .hero .back-btn{position:absolute;top:16px;left:20px}
  .back-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px 0 10px;border-radius:22px;background:#fff;border:2px solid var(--ink);
            box-shadow:0 3px 0 var(--ink);cursor:pointer;font-weight:600;font-size:15px;flex:none}
  .back-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .title-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:16px}
  .title-row h2{margin:0;font-size:28px}
  .title-row .pr{font-size:24px;color:var(--pink-dark)}

  .box{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:14px 16px;box-shadow:0 3px 0 var(--ink);margin-top:14px}
  .box h3{margin:0 0 10px;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .box h3 small{color:var(--muted);font-weight:400;font-size:13px}
  .req{color:var(--danger)}

  .fchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .fchip{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 10px;border-radius:16px;cursor:pointer;font-size:14px;line-height:1.2;text-align:left;
         border:2px dashed #C9B8CC;background:#fff;color:var(--muted);transition:background .16s,border-color .16s,color .16s}
  .fchip.on{border:2px solid var(--ink);background:var(--soft);color:var(--ink);font-weight:600}
  .fchip:disabled{opacity:.4;cursor:not-allowed}
  .fchip svg{flex:none}
  .pop{animation:pop .36s ease-out}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(.88)}75%{transform:scale(1.07)}100%{transform:scale(1)}}

  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
  .row + .row{border-top:2px dashed var(--line)}
  .row .lbl{font-weight:600;font-size:15px}
  .row .lbl small{display:block;color:var(--muted);font-size:12px;font-weight:400}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper button{width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);background:var(--soft);font-size:22px;font-weight:700;cursor:pointer}
  .stepper button:disabled{opacity:.35;cursor:not-allowed}
  .stepper span{min-width:24px;text-align:center;font-family:Itim,sans-serif;font-size:20px}
  .switch{width:58px;height:34px;border-radius:17px;border:2px solid var(--ink);position:relative;cursor:pointer;background:#EADCE0;transition:background .2s;flex:none}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;border:2px solid var(--ink);
                 box-sizing:border-box;transition:left .24s cubic-bezier(.34,1.6,.5,1)}
  .switch.on{background:var(--pink)}
  .switch.on::after{left:27px}

  /* the cup + fruit animation */
  .fw{transition:transform .5s cubic-bezier(.34,1.4,.5,1)}
  .fr{transform-box:fill-box;transform-origin:50% 100%;transition:transform .56s cubic-bezier(.34,1.9,.5,1),opacity .18s ease-out}
  .fr.off{transform:translateY(14px) scale(.1);opacity:0;transition:transform .42s cubic-bezier(.55,-.6,.75,.4),opacity .26s ease-in .16s}
  .rp{transform-box:fill-box;transform-origin:50% 50%;opacity:0}
  .rp.go{animation:ripple .62s ease-out}
  .rp.go.late{animation-delay:.22s}
  @keyframes ripple{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.8);opacity:0}}
  .drz{stroke-dasharray:120;stroke-dashoffset:120;transition:stroke-dashoffset .7s ease-in-out}
  .drz.on{stroke-dashoffset:0}
  .body{transform-box:fill-box;transform-origin:50% 100%}
  .body.wob{animation:wob .45s ease-out}
  @keyframes wob{0%{transform:scale(1,1)}30%{transform:scale(1.06,.92)}60%{transform:scale(.97,1.04)}100%{transform:scale(1,1)}}
  .fh{opacity:0}
  .cup.happy .fh{opacity:1}
  .cup.happy .fn{opacity:0}

  /* cart */
  .ci{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
  .ci + .ci{border-top:2px dashed var(--line)}
  .ci .thumb{width:50px;height:50px;border-radius:14px;border:2px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center}
  .ci .info{flex:1;min-width:0}
  .ci .nm{font-family:Itim,sans-serif;font-size:17px}
  .ci .opt{font-size:12px;color:var(--muted)}
  .ci .pr{font-family:Itim,sans-serif;font-size:17px;white-space:nowrap}
  .link{background:none;border:0;padding:4px 0;font-size:13px;cursor:pointer;color:var(--ink);text-decoration:underline;margin-right:16px;font-weight:600}
  .link.del{color:var(--danger)}
  label.f{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
  input,textarea{width:100%;font-size:16px;padding:11px 14px;border:2px solid var(--ink);border-radius:14px;background:#fff}
  input:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px var(--soft)}
  .rounds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .round{min-height:54px;padding:8px 12px;border-radius:16px;border:2px dashed #C9B8CC;background:#fff;text-align:left;
         display:flex;flex-direction:column;justify-content:center;gap:1px;cursor:pointer}
  .round b{font-weight:600;font-size:15px}
  .round small{font-size:12px;color:var(--muted)}
  .round.on{border:2px solid var(--ink);background:var(--soft)}
  .dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:Itim,sans-serif;font-size:18px;padding-bottom:6px;border-bottom:2px dashed var(--line)}
  .dayhead span{font-family:Mali,sans-serif;font-size:13px;color:var(--muted)}
  .days{align-self:stretch;display:flex;flex-direction:column;gap:6px;margin-top:12px;text-align:left}
  .days div{display:flex;align-items:baseline;gap:8px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 12px}
  .days b{font-family:Itim,sans-serif;font-weight:400;font-size:16px;white-space:nowrap}
  .days span{flex:1;font-size:12px;color:var(--muted);min-width:0}
  .days em{font-style:normal;font-family:Itim,sans-serif;font-size:16px}
  .hist-btn{display:flex;align-items:center;gap:8px;width:100%;margin-top:14px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:10px 14px;
            box-shadow:0 3px 0 var(--ink);cursor:pointer;font-weight:600;font-size:15px;text-align:left}
  .hist-btn span{flex:1}
  .hist-btn em{font-style:normal;background:var(--soft);border:2px solid var(--ink);border-radius:12px;min-width:26px;padding:0 6px;text-align:center;font-size:13px}
  .hcard{padding-top:10px}
  .hhead{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;border-bottom:2px dashed var(--line)}
  .hhead b{font-family:Itim,sans-serif;font-weight:400;font-size:19px}
  .hhead span{font-size:12px;color:var(--muted)}
  .hrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0}
  .hrow + .hrow{border-top:2px dashed var(--line)}
  .hrow b{font-weight:600;font-size:15px;display:block}
  .hrow small{display:block;font-size:12px;color:var(--muted)}
  .hrow em{font-style:normal;font-family:Itim,sans-serif;font-size:17px;white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chip{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1.5px solid var(--ink)}
  .chip.warn{background:#FFF1C7}.chip.info{background:#E1F0FB}.chip.ok{background:#D8F3E3}.chip.done{background:#ECE6F2}.chip.bad{background:#FFE0E6;color:var(--danger)}
  .hfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px;border-top:2px dashed var(--line);font-size:13px;color:var(--muted)}
  .mini{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer;min-height:36px}
  .mini.pink{background:var(--pink)}
  .mini:disabled{opacity:.4;cursor:not-allowed}
  .mini.danger{background:#fff;color:var(--danger);border-color:var(--danger)}
  .mini.armed,.link.armed{background:var(--danger);color:#fff;border-color:var(--danger);text-decoration:none;padding:4px 10px;border-radius:10px}
  .total{display:flex;justify-content:space-between;align-items:baseline}
  .total span{font-family:Itim,sans-serif;font-size:19px}
  .total b{font-family:Itim,sans-serif;font-weight:400;font-size:26px;color:var(--pink-dark)}
  .err{color:var(--danger);font-size:14px;margin-top:10px;display:none;font-weight:600}
  .payopts{display:flex;flex-direction:column;gap:8px}
  .payopt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:2px dashed #C9B8CC;background:#fff;text-align:left;cursor:pointer;min-height:60px}
  .payopt .dot{width:24px;height:24px;border-radius:12px;border:2px solid var(--ink);flex:none;position:relative;background:#fff}
  .payopt.on{border:2px solid var(--ink);background:var(--soft)}
  .payopt.on .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--pink-dark)}
  .payopt b{display:block;font-weight:600;font-size:15px}
  .payopt small{display:block;font-size:12px;color:var(--muted)}

  /* done */
  .done{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:30px;text-align:center}
  .oid{font-family:Itim,sans-serif;font-size:24px;background:#fff;border:2px dashed var(--ink);padding:2px 14px;border-radius:12px;letter-spacing:1px}
  .paycard{align-self:stretch;background:#fff;border:2.5px solid var(--ink);border-radius:24px;padding:18px;margin-top:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;text-align:left}
  .qr{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed #C9B8CC;border-radius:18px;padding:14px}
  .qr .tag{font-size:12px;font-weight:600;color:#fff;background:#113566;padding:3px 10px;border-radius:6px}
  .qr img{width:200px;height:200px;display:block}
  .or{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
  .or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
  .acct{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:12px 14px}
  .acct .k{width:42px;height:42px;border-radius:12px;background:#138F2D;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Itim,sans-serif;font-size:20px;flex:none}
  .acct .no{font-family:Itim,sans-serif;font-size:22px;letter-spacing:.5px}
  .slip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;border-radius:18px;border:2px dashed var(--ink);
        background:#FFF8FA;font-weight:600;cursor:pointer;text-align:center;padding:14px;position:relative}
  .slip input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .slip img{max-width:160px;max-height:220px;border-radius:10px;border:2px solid var(--ink)}
  .slip.ok{border-style:solid;background:#E8F7EF;color:#1E6B47}
  .slip.err{color:var(--danger);background:#FFF0F3}
  .later{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:16px;padding:14px;text-align:left}
  .later .ic{width:42px;height:42px;border-radius:12px;background:#06C755;display:flex;align-items:center;justify-content:center;flex:none}
  .banner{display:flex;align-items:center;gap:10px;background:#FFF1C7;border:2px solid var(--ink);border-radius:16px;padding:12px 14px;margin-top:14px;width:100%;text-align:left;cursor:pointer;font-weight:600;font-size:14px}
  .banner span{flex:1}
  .install{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:10px 12px;margin-top:14px;font-size:13px;color:var(--muted)}
  .install b{color:var(--ink);display:block;font-size:14px}
  .install button{border:2px solid var(--ink);background:var(--pink);border-radius:12px;padding:6px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .install .x{background:none;border:0;color:var(--muted);padding:8px;font-size:18px;line-height:1}
  .loading{text-align:center;color:var(--muted);padding:80px 0}
  .spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(75,58,79,.25);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .tick{animation:bob 1.6s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){ .fr,.fr.off,.drz,.sheet{transition:none} .rp.go,.pop,.tick,.body.wob{animation:none} }
</style>
</head>
<body>

<div class="wrap" id="app"><div class="loading">กำลังโหลดเมนู…</div></div>

<div class="bar" id="bar" style="display:none"><div class="maxw"><button class="btn" id="barBtn" onclick="openCart()"></button></div></div>

<div class="overlay" id="overlay" onclick="closeSheets()"></div>
<div class="sheet" id="itemSheet" role="dialog" aria-modal="true"><div class="inner" id="itemInner"></div></div>
<div class="sheet" id="cartSheet" role="dialog" aria-modal="true"><div class="inner" id="cartInner"></div></div>
<div class="sheet" id="histSheet" role="dialog" aria-modal="true"><div class="inner" id="histInner"></div></div>

<script>

/* one way to talk to the backend, whether the page runs inside Apps Script, on GitHub Pages, or as a demo */
function call(fn, arg){
  return new Promise((resolve, reject) => {
    if (IS_GAS) return google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](arg);
    if (API_URL){
      const action = {getConfig:'config', submitOrder:'order', attachSlip:'slip', myOrders:'history', cancelOrder:'cancel'}[fn];
      const body = fn === 'submitOrder' ? {action, order: arg} : Object.assign({action}, arg || {});
      fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect:'follow'})
        .then(r => r.text().then(t => {
          let j; try { j = JSON.parse(t); } catch(e) {
            console.error('Apps Script reply', r.status, t.slice(0, 500));
            const why = /authoriz|ขออนุญาต|sign in|ลงชื่อเข้าใช้/i.test(t) ? 'ร้านต้องกดอนุญาตสิทธิ์ใน Apps Script ใหม่'
                      : /doPost|not found|ไม่พบ/i.test(t) ? 'Apps Script ยังไม่ได้ Deploy เวอร์ชันล่าสุด'
                      : 'Apps Script ตอบกลับผิดรูปแบบ (' + r.status + ')';
            throw new Error('ส่งไม่สำเร็จ: ' + why);
          }
          return j;
        }), () => { throw new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่'); })
        .then(j => j.ok ? resolve(j.data) : reject(new Error(j.error)))
        .catch(e => reject(e));
      return;
    }
    setTimeout(() => { // demo
      if (fn === 'getConfig') resolve(DEMO_CONFIG);
      else if (fn === 'submitOrder') { const oid = 'G' + (1000 + Math.floor(Math.random() * 9000)); resolve({ orderId: oid, token:'demo', payLater: !!arg.payLater, total: foodTotal(), cups: cupCount(),
        parts: [...new Set(cart.map(it => it.round))].map((rd,k,a) => { const its = cart.filter(it => it.round === rd);
          return { orderId: a.length > 1 ? oid + '-' + (k+1) : oid, round: rd, cups: its.reduce((s,it) => s + it.qty, 0), total: its.reduce((s,it) => s + linePrice(it), 0),
                   summary: its.map(it => menuOf(it.menuId).name + (it.qty > 1 ? ' x' + it.qty : '')).join(', ') }; }),
        bankAccount:C.bankAccount, accountName:C.accountName, bankName:C.bankName }); }
      else if (fn === 'myOrders' || fn === 'cancelOrder') {
        const gone = load('demo_cancel') || [];
        if (fn === 'cancelOrder') { history_().filter(h => h.orderId === arg.orderId).forEach(h => (h.parts || []).forEach(p => { if (!arg.partId || p.orderId === arg.partId) gone.push(p.orderId); })); save('demo_cancel', gone); }
        const out = {}; history_().forEach(h => out[h.orderId] = (h.parts || []).map(p => ({ id: p.orderId, round: p.round, total: p.total,
          pay: h.slip ? 'ส่งสลิปแล้ว' : 'ยังไม่จ่าย', status: gone.indexOf(p.orderId) >= 0 ? 'ยกเลิก' : 'ใหม่', slip: !!h.slip }))); resolve(out); }
      else resolve({ orderId: arg.orderId });
    }, 700);
  });
}

  const inCart = {}; cart.forEach(it => inCart[it.menuId] = (inCart[it.menuId]||0) + it.qty);
  $('app').innerHTML = `
    <div class="top">
      <div class="logo h">${happyCup(40)}${esc(C.shopName)}</div>
      ${C.salePeriod ? `<div class="pill">รอบส่ง ${esc(C.salePeriod)}</div>` : ''}
    </div>
    <h1 class="hello h">วันนี้กินถ้วยไหนดี~</h1>
    <div class="sub">แตะเมนู เลือกผลไม้ แล้วกดสั่งได้เลย</div>
    ${IS_GAS || API_URL ? '' : '<div class="demo">โหมดตัวอย่าง (ยังไม่ต่อ Google Sheet)</div>'}
    ${C.open ? '' : `<div class="closed">${esc(C.closedMsg)}</div>`}
    ${load('greek_pending') ? `<button class="banner" onclick="renderDone(load('greek_pending'))">${ICON.qr}<span>ออเดอร์ ${esc(load('greek_pending').orderId)} ยังไม่ได้แนบสลิป</span>แนบเลย →</button>` : ''}
    ${installCard()}
    ${history_().length ? `<button class="hist-btn" onclick="openHistory()">${ICON.receipt}<span>ออเดอร์ของฉัน</span><em>${history_().length}</em></button>` : ''}
    <div class="grid">
      ${C.menu.map(m => `
        <button class="menu ${inCart[m.id]?'in-cart':''}" onclick="openItem('${m.id}')" ${C.open?'':'disabled'}>
          ${inCart[m.id] ? `<span class="badge">${inCart[m.id]}</span>` : ''}
          <div class="art" style="background:${tintOf(m)}">${cup(m, {fruits: availFruits().slice(0, m.fruitPick).map(f => f.name)})}</div>
          <div class="nm h">${esc(m.name)}</div>
          <div class="ds">${esc(m.desc)}</div>
          <div class="prow"><div class="pr h">${baht(m.price)}</div><span class="plus" aria-hidden="true">+</span></div>
        </button>`).join('')}
    </div>`;
  const n = cupCount();
  $('bar').style.display = n ? 'block' : 'none';
  $('barBtn').innerHTML = `<span style="display:flex;align-items:center;gap:10px">${ICON.cart}ตะกร้า · ${n} ถ้วย</span><span>${C.open ? baht(foodTotal()) + ' →' : 'ร้านปิดรับอยู่'}</span>`;
}

/* ---------- item sheet: built once, then updated in place so animations run ---------- */
function openItem(menuId, idx){
  const m = menuOf(menuId);
  editIndex = (idx === undefined) ? -1 : idx;
  draft = editIndex >= 0 ? JSON.parse(JSON.stringify(cart[editIndex]))
        : { menuId, qty:1, addons:{}, fruits: [], round: defaultRound() };   // no fruit picked yet — customer chooses
  if (C.rounds.indexOf(draft.round) < 0) draft.round = defaultRound();
  const fruitsBox = m.fruitPick > 0 ? `
    <div class="box">
      <h3><span>เลือกผลไม้ <span class="req">*</span></span><small id="pickInfo"></small></h3>
      <div class="fchips">
        ${availFruits().map((f,i) => `<button class="fchip" id="fc${i}" onclick="toggleFruit(${i})">${chipIcon(f)}${esc(f.name)}</button>`).join('')}
      </div>
    </div>` : '';
  const addons = addonsFor(m).map(a => a.type === 'count' ? `
      <div class="row"><div class="lbl">${esc(a.name)}<small>+${baht(a.price)} ต่อ scoop</small></div>
        <div class="stepper"><button id="ad-${a.id}-m" aria-label="ลด ${esc(a.name)}" onclick="stepAddon('${a.id}',-1)">−</button>
        <span id="ad-${a.id}">0</span><button id="ad-${a.id}-p" aria-label="เพิ่ม ${esc(a.name)}" onclick="stepAddon('${a.id}',1)">+</button></div></div>` : `
      <div class="row"><div class="lbl">${esc(a.name)}<small>+${baht(a.price)}</small></div>
        <button class="switch" id="ad-${a.id}" aria-label="${esc(a.name)}" onclick="stepAddon('${a.id}',0)"></button></div>`).join('');
  $('itemInner').innerHTML = `
    <div class="hero" style="background:${tintOf(m)}">
      <button class="back-btn" onclick="closeSheets()">${ICON.back}<span>${editIndex >= 0 ? 'กลับไปตะกร้า' : 'กลับ'}</span></button>
      ${cup(m, {size: 220, live: true, fruits: draft.fruits})}
    </div>
    <div class="title-row"><h2 class="h">${esc(m.name)}</h2><div class="pr h">${baht(m.price)}</div></div>
    ${m.desc ? `<div class="sub">${esc(m.desc)}</div>` : ''}
    ${fruitsBox}
    ${addonsFor(m).length ? `<div class="box" style="padding-top:6px;padding-bottom:6px">${addons}</div>` : ''}
    ${C.rounds.length > 1 ? `<div class="box"><h3>รับวันไหน <small>ถ้วยนี้</small></h3><div class="rounds">
      ${C.rounds.map((r,i) => `<button class="round" id="rd${i}" onclick="pickItemRound(${i})"><b>${esc(roundLabel(r))}</b>${(C.roundNotes||{})[r] ? `<small>${esc(C.roundNotes[r])}</small>` : ''}</button>`).join('')}
    </div></div>` : ''}
    <div class="box" style="padding-top:6px;padding-bottom:6px"><div class="row"><div class="lbl">จำนวน<small id="unitTxt"></small></div>
      <div class="stepper"><button id="qm" aria-label="ลดจำนวน" onclick="setQty(-1)">−</button><span id="qv">1</span><button aria-label="เพิ่มจำนวน" onclick="setQty(1)">+</button></div></div></div>
    <div class="sheet-bar"><button class="btn" id="addBtn" onclick="commitItem()"><span id="addLbl"></span><span id="addPrice"></span></button></div>`;
  show('itemSheet');
  refreshItem();
  // fruits pop out of the yogurt one by one when the sheet opens
  availFruits().forEach((f,i) => { if (draft.fruits.indexOf(f.name) >= 0) setTimeout(() => setFruit(i, true, true), 280 + i * 90); });
}
function setFruit(i, on, ripple){
  const g = $('fr'+i); if (!g) return;
  g.classList.toggle('off', !on);
  if (ripple){ const r = $('rp'+i); r.classList.remove('go','late'); r.getBoundingClientRect(); r.classList.add('go'); if (!on) r.classList.add('late'); }
}
function refreshItem(){
  const m = menuOf(draft.menuId);
  if (m.fruitPick > 0){
    const full = draft.fruits.length >= m.fruitPick;
    $('pickInfo').textContent = draft.fruits.length ? `เลือกได้ ${m.fruitPick} · เลือกแล้ว ${draft.fruits.length}` : `แตะเลือกได้สูงสุด ${m.fruitPick} อย่าง`;
    availFruits().forEach((f,i) => { const on = draft.fruits.indexOf(f.name) >= 0, b = $('fc'+i);
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.disabled = !on && full; });
  }
  addonsFor(m).forEach(a => { const n = draft.addons[a.id] || 0, el = $('ad-'+a.id);
    if (a.type === 'count'){ el.textContent = n; $('ad-'+a.id+'-m').disabled = n <= 0; $('ad-'+a.id+'-p').disabled = n >= a.max; }
    else { el.classList.toggle('on', !!n); el.setAttribute('aria-pressed', !!n); }
  });
  const syrup = addonsFor(m).find(a => a.type !== 'count');
  $('drz').classList.toggle('on', !!(syrup && draft.addons[syrup.id]));
  $('qv').textContent = draft.qty; $('qm').disabled = draft.qty <= 1;
  $('unitTxt').textContent = baht(unitPrice(draft)) + ' / ถ้วย';
  $('addPrice').textContent = baht(linePrice(draft));
  C.rounds.forEach((r,i) => { const b = $('rd'+i); if (b){ b.classList.toggle('on', draft.round === r); b.setAttribute('aria-pressed', draft.round === r); } });
  const needFruit = m.fruitPick > 0 && !draft.fruits.length;
  const needDay = C.rounds.length && C.rounds.indexOf(draft.round) < 0;
  $('addBtn').disabled = needFruit || needDay;
  $('addLbl').textContent = needFruit ? 'เลือกผลไม้ก่อนนะ' : needDay ? 'เลือกวันรับก่อนนะ' : editIndex >= 0 ? 'บันทึก' : 'ใส่ตะกร้า';
}
// a new cup starts on the day picked last time (or the only open day)
function defaultRound(){
  if (C.rounds.length === 1) return C.rounds[0];
  return C.rounds.indexOf(info.lastRound) >= 0 ? info.lastRound : '';
}
function pickItemRound(i){ draft.round = C.rounds[i]; refreshItem(); }
function toggleFruit(i){
  const name = availFruits()[i].name, k = draft.fruits.indexOf(name), m = menuOf(draft.menuId);
  if (k >= 0) draft.fruits.splice(k,1); else if (draft.fruits.length < m.fruitPick) draft.fruits.push(name); else return;
  const b = $('fc'+i); b.classList.remove('pop'); b.getBoundingClientRect(); b.classList.add('pop');
  setFruit(i, k < 0, true);
  setTimeout(layoutFruits, k < 0 ? 0 : 380);   // others slide over once the removed one has sunk
  cupReact(k < 0);
  refreshItem();
}
// the cup squishes a little, and smiles when a fruit goes in
let happyTimer = 0;
function cupReact(added){
  const body = $('cupBody'), svg = $('cupSvg'); if (!body) return;
  body.classList.remove('wob'); body.getBoundingClientRect(); body.classList.add('wob');
  if (added){ svg.classList.add('happy'); clearTimeout(happyTimer); happyTimer = setTimeout(() => svg.classList.remove('happy'), 900); }
}
function stepAddon(id, d){ const a = addonOf(id), n = draft.addons[id] || 0;
  const v = d === 0 ? (n ? 0 : 1) : Math.max(0, Math.min(a.max, n + d));
  if (v) draft.addons[id] = v; else delete draft.addons[id]; refreshItem(); }
function setQty(d){ draft.qty = Math.max(1, Math.min(50, draft.qty + d)); refreshItem(); }
function commitItem(){
  if (C.rounds.length && C.rounds.indexOf(draft.round) < 0) return;
  if (menuOf(draft.menuId).fruitPick > 0 && !draft.fruits.length) return;
  info.lastRound = draft.round;
  if (editIndex >= 0) cart[editIndex] = draft; else cart.push(draft);
  save('greek_cart', cart); closeSheets({stay: true}); render();
  if (editIndex >= 0) setTimeout(openCart, 260);
}

/* ---------- cart / checkout ---------- */
function openCart(){
  renderCart(); show('cartSheet');
  // re-check the shop (open/closed, days) so a phone left open since earlier can't order into a closed shop
  refreshConfig().then(() => { if (sheetOpen === 'cartSheet') renderCart(); }).catch(() => {});
}
function refreshConfig(){
  return call('getConfig').then(cfg => { if (!IS_GAS) save('greek_cfg', cfg);
    C = cfg; C.addons = C.addons || []; C.rounds = C.rounds || []; C.fruits = C.fruits || [];
    if (!sheetOpen && !document.querySelector('.done')) render(); });
}
function renderCart(){
  if (!cart.length){ closeSheets(); render(); return; }
  cart.forEach(it => { if (C.rounds.indexOf(it.round) < 0) it.round = C.rounds.length === 1 ? C.rounds[0] : (it.round && C.rounds.indexOf(it.round) >= 0 ? it.round : ''); });
  const groups = (C.rounds.length ? C.rounds.concat(['']) : ['']).map(r => ({ r, items: cart.map((it,i) => ({it, i})).filter(x => (x.it.round || '') === r) })).filter(g => g.items.length);
  const itemRow = ({it, i}) => { const m = menuOf(it.menuId); return `
        <div class="ci"><div class="thumb" style="background:${tintOf(m)}">${cup(m, {size:44, fruits: it.fruits, syrup: !!(it.addons && it.addons.HER)})}</div>
          <div class="info"><div class="nm">${esc(m.name)} × ${it.qty}</div>
            <div class="opt">${esc(describe(it)) || '—'}</div>
            <div><button class="link" onclick="editItem(${i})">แก้ไข</button><button class="link del" onclick="removeItem(${i})">ลบ</button></div></div>
          <div class="pr">${baht(linePrice(it))}</div></div>`; };
  $('cartInner').innerHTML = `
    <div style="padding-top:16px"><button class="back-btn" onclick="closeSheets()">${ICON.back}<span>กลับไปเลือกเมนู</span></button></div>
    ${C.open ? '' : `<div class="closed">${esc(C.closedMsg)}<div style="font-weight:400;font-size:13px;margin-top:4px">ของในตะกร้ายังเก็บไว้ให้ เปิดรอบหน้ากดสั่งต่อได้เลย</div></div>`}
    <h2 class="h" style="margin:14px 0 0;font-size:26px">ตะกร้าของคุณ</h2><div class="sub" style="font-size:13px">${cupCount()} ถ้วย · แตะ "แก้ไข" เพื่อเปลี่ยนผลไม้ จำนวน หรือวันรับ</div>
    ${groups.map(g => `<div class="box" style="padding-top:10px">
      <div class="dayhead">${g.r ? `รับวันที่ ${esc(g.r.replace(/^รับ(วันที่)?\s*/, ''))}` : '<span style="color:var(--danger)">ยังไม่ได้เลือกวันรับ — แตะ "แก้ไข"</span>'}
        <span>${g.items.reduce((s,x) => s + x.it.qty, 0)} ถ้วย · ${baht(g.items.reduce((s,x) => s + linePrice(x.it), 0))}</span></div>
      ${g.items.map(itemRow).join('')}
    </div>`).join('')}
    ${C.open ? `<button class="btn soft" style="margin-top:12px" onclick="closeSheets()">+ เพิ่มเมนู / เพิ่มวันรับอื่น</button>` : ''}
    <div class="box">
      <label class="f" for="fName">ชื่อ <span class="req">*</span></label>
      <input id="fName" value="${esc(info.name)}" placeholder="เช่น Ice, Nitcha" autocomplete="name" oninput="info.name=this.value">
      <div class="sub" style="font-size:12px;margin-top:6px">ใช้ชื่อเดียวกับใน LINE กลุ่ม จะได้เช็คยอดง่าย</div>
    </div>
    <div class="box"><label class="f" for="fNote">หมายเหตุ <span class="sub" style="font-weight:400;font-size:13px">ไม่บังคับ</span></label>
      <textarea id="fNote" rows="2" placeholder="เช่น ขอช้อน 2 อัน" oninput="info.note=this.value">${esc(info.note)}</textarea></div>
    <div class="box">
      <h3>จ่ายเงิน</h3>
      <div class="payopts">
        <button class="payopt ${info.payLater ? '' : 'on'}" aria-pressed="${!info.payLater}" onclick="pickPay(false)"><span class="dot"></span>
          <span><b>จ่ายเลย</b><small>สแกน QR / โอนกสิกร แล้วแนบสลิปในแอป</small></span></button>
        <button class="payopt ${info.payLater ? 'on' : ''}" aria-pressed="${info.payLater}" onclick="pickPay(true)"><span class="dot"></span>
          <span><b>จ่ายตอนรับของ</b><small>${esc(C.payLaterNote || 'ผ่านขุนทองในกลุ่ม LINE')}</small></span></button>
      </div>
      <div class="total" style="margin-top:14px"><span style="font-weight:600;font-size:17px">ยอดรวม</span><b>${baht(foodTotal())}</b></div>
    </div>
    <div class="err" id="err" role="alert"></div>
    <div class="sheet-bar"><button class="btn" id="submitBtn" onclick="submit()" ${C.open ? '' : 'disabled'}><span>${C.open ? 'ยืนยันสั่ง' : 'ร้านปิดรับออเดอร์อยู่'}</span><span>${baht(foodTotal())}</span></button></div>`;
}
function pickPay(later){ info.payLater = later;
  document.querySelectorAll('.payopt').forEach((b,j) => { const on = (j === 1) === later; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); }
function editItem(i){ closeSheets({stay: true}); setTimeout(() => openItem(cart[i].menuId, i), 260); }
function removeItem(i){ cart.splice(i,1); save('greek_cart', cart); render(); renderCart(); }

function submit(){
  const err = $('err'), fail = msg => { err.textContent = msg; err.style.display = 'block'; };
  err.style.display = 'none';
  if (!C.open) { fail(C.closedMsg); return; }
  if (!info.name.trim()) { fail('กรุณาใส่ชื่อ'); $('fName').focus(); return; }
  if (cart.some(it => menuOf(it.menuId).fruitPick > 0 && !(it.fruits || []).length)) { fail('มีถ้วยที่ยังไม่ได้เลือกผลไม้ แตะ "แก้ไข" ที่ถ้วยนั้น'); return; }
  if (C.rounds.length && cart.some(it => C.rounds.indexOf(it.round) < 0)) { fail('มีถ้วยที่ยังไม่ได้เลือกวันรับ แตะ "แก้ไข" ที่ถ้วยนั้น'); return; }
  const btn = $('submitBtn'); btn.disabled = true; btn.innerHTML = '<span>กำลังส่งออเดอร์…</span><span class="spin"></span>';
  save('greek_form', {name: info.name});
  const payload = { name: info.name, note: info.note, payLater: info.payLater, items: cart };
  const itemsText = cart.map(it => menuOf(it.menuId).name + ' x' + it.qty).join(', ');
  call('submitOrder', payload).then(res => {
    const done = Object.assign({}, res, { name: info.name, itemsText });
    if (!res.payLater) save('greek_pending', done);         // remember until the slip is in
    save('greek_history', [Object.assign({}, done, { at: Date.now(), items: JSON.parse(JSON.stringify(cart)) })].concat(history_()).slice(0, 30));
    cart = []; save('greek_cart', []); info.note = '';
    closeSheets({stay: true}); renderDone(done);
    setTimeout(() => { try { history.pushState({page:'done'}, ''); } catch(e){} }, 300);
  }).catch(e => { renderCart(); $('err').textContent = (e && e.message) || 'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง'; $('err').style.display = 'block'; });
}

        ${payNow ? `
        <div class="qr">
          <span class="tag">THAI QR PAYMENT · PromptPay</span>

        <div style="font-weight:600;font-size:15px;margin-top:4px">2) แนบสลิป</div>
        <label class="slip" id="slipBox">
          <input type="file" accept="image/*" onchange="pickSlip(this)" aria-label="เลือกรูปสลิป">

          <span>แตะเพื่อเลือกรูปสลิป</span>
          <span class="sub" style="font-weight:400;font-size:12px">เลือกจากอัลบั้มรูป ส่งเข้าร้านอัตโนมัติ</span>
        </label>` : `

          <div><b style="font-size:15px">จ่ายตอนรับของ</b><div class="sub" style="font-size:13px">${esc((C && C.payLaterNote) || 'ผ่านขุนทองในกลุ่ม LINE')} · ร้านจะส่งบิลให้ในกลุ่ม</div></div></div>`}
      </div>
      <button class="link" style="margin:14px 0 0" onclick="openHistory()">สั่งผิด? ดูหรือยกเลิกได้ที่ "ออเดอร์ของฉัน"</button>
      <div style="height:10px"></div>

// shrink the photo on the phone (slips are big), then send it to the shop
function shrink(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1400 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', .85));
    };
    img.onerror = () => reject(new Error('อ่านรูปนี้ไม่ได้ ลองเลือกรูปอื่น'));
    img.src = url;
  });
}
function pickSlip(input){
  const f = input.files && input.files[0]; if (!f) return;
  const box = $('slipBox'), r = load('greek_pending');
  if (!r) return;
  box.classList.remove('err','ok');
  box.innerHTML = '<span class="spin" style="border-color:rgba(37,70,168,.25);border-top-color:#2546A8"></span><span>กำลังส่งสลิป…</span>';
  shrink(f).then(img => {
    box.innerHTML = `<img src="${img}" alt="สลิปที่เลือก"><span>กำลังส่งสลิป…</span>`;
    return call('attachSlip', { orderId: r.orderId, token: r.token, image: img }).then(() => img);
  }).then(img => {
    try { localStorage.removeItem('greek_pending'); } catch(e){}
    save('greek_history', history_().map(h => h.orderId === r.orderId ? Object.assign(h, {slip: true}) : h));
    box.classList.add('ok');
    box.innerHTML = `<img src="${img}" alt="สลิปที่ส่งแล้ว"><span>ร้านได้รับสลิปแล้ว ขอบคุณค่า</span>`;
  }).catch(e => {
    box.classList.add('err');
    box.innerHTML = `<input type="file" accept="image/*" onchange="pickSlip(this)" aria-label="เลือกรูปสลิปใหม่"><span>${esc(e.message || 'ส่งไม่สำเร็จ')}</span><span style="font-weight:400;font-size:13px">แตะเพื่อลองใหม่</span>`;
  });
}
function copyText(v, b){
  const span = b.querySelector('span') || b, done = () => { span.textContent = 'คัดลอกแล้ว ✓'; };
  const fallback = () => {
    const t = document.createElement('textarea'); t.value = v; t.setAttribute('readonly','');
    t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
    try { if (document.execCommand('copy')) done(); else span.textContent = v; } catch(e){ span.textContent = v; }
    document.body.removeChild(t);
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(v).then(done).catch(fallback); else fallback();
}

/* ---------- "add to home screen" hint (web version only) ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (C) render(); });
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function installCard(){
  if (IS_GAS || !API_URL || standalone() || load('greek_noinstall')) return '';
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (!installEvt && !ios) return '';
  return `<div class="install">${happyCup(34)}<div style="flex:1"><b>ติดตั้งเป็นแอป</b>${ios ? 'กดปุ่มแชร์ ⎋ แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"' : 'เปิดสั่งได้จากหน้าจอมือถือเลย'}</div>
    ${installEvt ? '<button onclick="doInstall()">ติดตั้ง</button>' : ''}<button class="x" aria-label="ปิด" onclick="save(\'greek_noinstall\',1);render()">×</button></div>`;
}
function doInstall(){ if (installEvt){ installEvt.prompt(); installEvt = null; render(); } }

/* ---------- order history (kept on this phone; live status from the sheet) ---------- */
const history_ = () => load('greek_history') || [];
const PAY_TXT = {'ยังไม่จ่าย':['ยังไม่จ่าย','warn'], 'ส่งสลิปแล้ว':['ส่งสลิปแล้ว รอร้านเช็ค','info'], 'จ่ายแล้ว':['จ่ายแล้ว','ok']};
const ST_TXT = {'ใหม่':['ร้านได้รับออเดอร์แล้ว','info'], 'ทำแล้ว':['ทำเสร็จแล้ว รอรับ','ok'], 'ส่งแล้ว':['รับของแล้ว','done'], 'ยกเลิก':['ยกเลิก','bad']};
let histLive = {};
function openHistory(){
  histLive = null; renderHistory(); show('histSheet');
  refreshConfig().then(() => { if (sheetOpen === 'histSheet') renderHistory(); }).catch(() => {});
  const list = history_().map(h => ({ orderId: h.orderId, token: h.token }));
  call('myOrders', { orders: list }).then(m => { histLive = m || {}; renderHistory(); })
    .catch(() => { histLive = {}; renderHistory('อัปเดตสถานะไม่ได้ตอนนี้ — แสดงข้อมูลที่จำไว้'); });
}
function renderHistory(note){
  const hs = history_(), fmt = t => new Date(t).toLocaleDateString('th-TH', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  const chip = (map, v) => { const x = map[v]; return x ? `<span class="chip ${x[1]}">${esc(x[0])}</span>` : ''; };
  $('histInner').innerHTML = `
    <div style="padding-top:16px"><button class="back-btn" onclick="closeSheets()">${ICON.back}<span>กลับ</span></button></div>
    <h2 class="h" style="margin:14px 0 0;font-size:26px">ออเดอร์ของฉัน</h2>
    <div class="sub" style="font-size:13px">${histLive === null ? '<span class="spin"></span> กำลังอัปเดตสถานะ…' : esc(note || 'สถานะล่าสุดจากร้าน')}</div>
    ${C.open ? '' : `<div class="closed" style="margin-top:12px">${esc(C.closedMsg)} · สั่งซ้ำได้ตอนร้านเปิด</div>`}
    ${hs.map((h, k) => { const live = histLive && histLive[h.orderId];
      const rows = live || (h.parts || []).map(p => ({ id: p.orderId, round: p.round, total: p.total }));
      const alive = live ? live.filter(r => r.status !== 'ยกเลิก') : rows;
      const needSlip = !h.payLater && !h.slip && alive.length && !(live && alive.every(r => r.slip || r.pay === 'จ่ายแล้ว'));
      // before the sheet answers, offer cancel on anything this phone hasn't sent a slip for; the server re-checks on tap
      const canCancel = r => live ? (r.pay === 'ยังไม่จ่าย' && !r.slip && r.status !== 'ส่งแล้ว' && r.status !== 'ยกเลิก') : !h.slip;
      const cancellable = rows.filter(canCancel);
      return `<div class="box hcard">
        <div class="hhead"><b>${esc(h.orderId)}</b><span>${fmt(h.at)}</span></div>
        ${rows.map(r => { const part = (h.parts || []).find(p => p.orderId === r.id) || {};
          return `<div class="hrow"><div><b>${esc(roundLabel(r.round || ''))}</b><small>${esc(part.summary || '')}</small>
            <div class="chips">${live ? chip(ST_TXT, r.status) + (r.status === 'ยกเลิก' ? '' : chip(PAY_TXT, r.pay)) : ''}</div>
            ${rows.length > 1 && canCancel(r) ? `<button class="link del" onclick="askCancel(this, ${k}, '${esc(r.id)}')">ยกเลิกวันนี้</button>` : ''}</div>
            <em style="${r.status === 'ยกเลิก' ? 'text-decoration:line-through;opacity:.5' : ''}">${baht(r.total)}</em></div>`; }).join('')}
        <div class="hfoot"><span>${h.payLater ? 'จ่ายตอนรับของ' : 'จ่ายเลย'} · ${alive.length ? 'รวม ' + baht(live ? alive.reduce((t,r) => t + r.total, 0) : h.total) : 'ยกเลิกทั้งออเดอร์แล้ว'}</span>
          <span style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">${rows.length === 1 && cancellable.length ? `<button class="mini danger" onclick="askCancel(this, ${k}, '')">ยกเลิกออเดอร์</button>` : ''}
          ${rows.length > 1 && cancellable.length > 1 ? `<button class="mini danger" onclick="askCancel(this, ${k}, '')">ยกเลิกทั้งหมด</button>` : ''}
          ${needSlip ? `<button class="mini" onclick="slipFromHistory(${k})">แนบสลิป</button>` : ''}
          <button class="mini pink" onclick="reorder(${k})" ${C.open ? '' : 'disabled title="ร้านปิดรับอยู่"'}>สั่งซ้ำ</button></span></div>
      </div>`; }).join('')}
    <div class="sub" style="font-size:12px;text-align:center;margin-top:14px">เก็บไว้ในมือถือเครื่องนี้ · 30 ออเดอร์ล่าสุด</div>`;
}
// two taps to cancel, so a stray tap never cancels an order
function askCancel(btn, k, partId){
  if (!btn.dataset.armed){
    btn.dataset.armed = '1'; btn.dataset.label = btn.textContent; btn.textContent = 'แตะอีกครั้งเพื่อยืนยัน'; btn.classList.add('armed');
    setTimeout(() => { if (btn.isConnected && btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = btn.dataset.label; btn.classList.remove('armed'); } }, 4000);
    return;
  }
  const h = history_()[k]; btn.disabled = true; btn.textContent = 'กำลังยกเลิก…';
  call('cancelOrder', { orderId: h.orderId, token: h.token, partId: partId || '' }).then(m => {
    histLive = Object.assign(histLive || {}, m || {});
    const rows = (m || {})[h.orderId] || [];
    if (rows.length && rows.every(r => r.status === 'ยกเลิก')){ const p = load('greek_pending'); if (p && p.orderId === h.orderId) { try { localStorage.removeItem('greek_pending'); } catch(e){} } }
    renderHistory('ยกเลิกเรียบร้อย');
  }).catch(e => renderHistory((e && e.message) || 'ยกเลิกไม่สำเร็จ ลองใหม่อีกครั้ง'));
}
function slipFromHistory(k){ const h = history_()[k]; save('greek_pending', h); closeSheets({stay: true}); renderDone(h); }
function reorder(k){
  if (!C.open) return;
  const h = history_()[k];
  const add = (h.items || []).filter(it => menuOf(it.menuId)).map(it => Object.assign(JSON.parse(JSON.stringify(it)), {
    round: C.rounds.indexOf(it.round) >= 0 ? it.round : (C.rounds.length === 1 ? C.rounds[0] : ''),
    fruits: (it.fruits || []).filter(f => availFruits().some(x => x.name === f)) }));
  if (!add.length) return;
  cart = cart.concat(add); save('greek_cart', cart);
  closeSheets({stay: true}); render(); setTimeout(openCart, 260);
}

/* ---------- sheets ---------- */
/* each open sheet is a step in the browser history, so the phone's back button / swipe closes it
   instead of leaving the app; closing a fruit sheet opened from the cart goes back to the cart */
let sheetOpen = null, ignorePop = false;
function show(id){
  $('overlay').classList.add('show'); $(id).classList.add('show'); $(id).scrollTop = 0;
  const had = !!sheetOpen; sheetOpen = id;
  try { history[had ? 'replaceState' : 'pushState']({sheet: id}, ''); } catch(e){}
}
function hideSheets(){ ['itemSheet','cartSheet','histSheet'].forEach(id => $(id).classList.remove('show')); $('overlay').classList.remove('show'); sheetOpen = null; }
function closeSheets(opts){
  const toCart = sheetOpen === 'itemSheet' && editIndex >= 0 && !(opts && opts.stay);
  hideSheets();
  if (history.state && history.state.sheet){ ignorePop = true; history.back(); }
  if (toCart) setTimeout(openCart, 260);
}
window.addEventListener('popstate', () => {
  if (ignorePop){ ignorePop = false; return; }
  if (sheetOpen) closeSheets();                                   // phone back button on a sheet
  else if (document.querySelector('.done')) render();             // back from the "ordered" screen
});

/* ---------- boot ---------- */
function boot(cfg){
  C = cfg; C.addons = C.addons || []; C.rounds = C.rounds || []; C.fruits = C.fruits || [];
  cart = (load('greek_cart') || []).filter(it => menuOf(it.menuId));
  const sheetOpen = $('itemSheet').classList.contains('show') || $('cartSheet').classList.contains('show');
  if (!sheetOpen && !document.querySelector('.done')) render();
}
const cached = !IS_GAS && API_URL ? load('greek_cfg') : null;
if (cached) boot(cached);                              // open instantly with last menu…
call('getConfig').then(cfg => { if (!IS_GAS) save('greek_cfg', cfg); boot(cfg); })   // …then refresh from the sheet
  .catch(e => { if (!cached) $('app').innerHTML = '<div class="loading">โหลดเมนูไม่สำเร็จ<br>' + esc(e.message) + '</div>'; });
if ('serviceWorker' in navigator && !IS_GAS && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
