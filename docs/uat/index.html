<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>UAT · Bright Greek</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Jersey+10&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* 16-bit arcade theme — pixel frames are box-shadows (no rounded corners), soft pastel colours */
  :root{
    --bg:#FFF4EF; --card:#FFFFFF; --ink:#3B2A40; --muted:#7A6A7E; --line:#EADCE0;
    --pink:#FF8FAB; --pink-dark:#C93C63; --soft:#FFE3EA; --mint:#BDEBD6; --coin:#FFD34E; --danger:#C0284F; --ok:#2E9E6A;
    --lilac:#CDBDD3;
    --px-font:'Jersey 10','Chakra Petch',system-ui,sans-serif;
    --arcade:'Press Start 2P',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  /* every framed thing gets the same pixel outline: --ec = edge colour, --pw = pixel size, --dp = drop under it */
  *{--ec:var(--ink);--pw:3px;--pxs:0 calc(-1 * var(--pw,3px)) 0 0 var(--ec,var(--ink)), 0 var(--pw,3px) 0 0 var(--ec,var(--ink)), calc(-1 * var(--pw,3px)) 0 0 0 var(--ec,var(--ink)), var(--pw,3px) 0 0 0 var(--ec,var(--ink))}
  html,body{margin:0;font-synthesis:none;color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;font-weight:500}
  body{padding-bottom:110px;background-color:var(--bg);
       background-image:linear-gradient(rgba(59,42,64,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(59,42,64,.035) 2px,transparent 2px);background-size:24px 24px}
  button,input,textarea{font:inherit;color:inherit}
  .h{font-family:var(--px-font);font-weight:700;font-synthesis:none;letter-spacing:.3px}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px}
  .sub{color:var(--muted);font-size:14px}
  .pxi{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}

  /* header */
  .top{padding:22px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-size:34px;letter-spacing:.5px;text-shadow:2px 2px 0 var(--soft)}
  .pill{font-size:12px;font-weight:600;background:var(--coin);padding:4px 10px;white-space:nowrap;--pw:2px;box-shadow:var(--pxs);margin:2px}
  .kicker{font-family:var(--arcade);font-size:9px;color:var(--pink-dark);margin-top:16px;letter-spacing:1px}
  h1.hello{margin:8px 0 2px;font-size:27px;line-height:1.25;font-family:'Chakra Petch',sans-serif;font-weight:700}
  .demo{font-size:12px;background:#FFF1C7;padding:4px 10px;display:inline-block;margin-top:10px;--pw:2px;box-shadow:var(--pxs)}
  .closed{background:#FFF1C7;padding:14px;margin-top:16px;text-align:center;font-weight:600;box-shadow:var(--pxs)}
  .closed::before{content:"❚❚ PAUSE";display:block;font-family:var(--arcade);font-size:9px;color:var(--pink-dark);margin-bottom:6px;letter-spacing:1px}

  /* menu grid */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}
  .menu{background:var(--card);border:0;padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;margin:3px;
        box-shadow:var(--pxs),0 9px 0 0 rgba(59,42,64,.18);position:relative;text-align:left;cursor:pointer;transition:transform .08s steps(2),box-shadow .08s steps(2)}
  .menu:active{transform:translateY(3px);box-shadow:var(--pxs),0 6px 0 0 rgba(59,42,64,.18)}
  .menu:disabled{opacity:.5;cursor:not-allowed}
  .menu.in-cart{--ec:var(--pink-dark);background:#FFF8FA}
  .menu .art{height:118px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -24px 0 rgba(59,42,64,.06)}
  .menu .art .pxi{width:136px;height:auto}
  .menu .nm{font-size:25px;margin-top:6px;line-height:1.15}
  .menu .ds{font-size:12px;color:var(--muted);min-height:18px}
  .prow{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
  .menu .pr{font-size:29px;color:var(--pink-dark)}
  .plus{width:28px;height:28px;background:var(--pink);font-family:var(--px-font);font-size:26px;line-height:26px;text-align:center;font-weight:400;--pw:2px;box-shadow:var(--pxs);margin-right:2px}
  .badge{position:absolute;top:-9px;right:-9px;background:var(--coin);font-family:var(--px-font);font-size:18px;font-weight:400;min-width:26px;height:26px;
         display:flex;align-items:center;justify-content:center;padding:0 6px;z-index:1;--pw:2px;box-shadow:var(--pxs)}

  /* buttons */
  .bar{position:fixed;left:0;right:0;bottom:0;padding:14px 23px calc(20px + env(safe-area-inset-bottom));
       background:linear-gradient(to top,var(--bg) 75%,rgba(255,244,239,0));z-index:5}
  .maxw{max-width:560px;margin:0 auto}
  .btn{width:100%;border:0;padding:14px 18px;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:18px;
       background:var(--pink);color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;
       box-shadow:var(--pxs),inset 0 -4px 0 rgba(201,60,99,.35),inset 0 3px 0 rgba(255,255,255,.45),0 9px 0 0 rgba(59,42,64,.22);transition:transform .08s steps(2),box-shadow .08s steps(2)}
  .btn:active{transform:translateY(4px);box-shadow:var(--pxs),inset 0 -2px 0 rgba(201,60,99,.35),0 5px 0 0 rgba(59,42,64,.22)}
  .btn > span:last-child{font-family:var(--px-font);font-weight:700;font-size:24px}
  .btn:disabled,.btn.dim{background:#EADCE0;cursor:not-allowed;box-shadow:var(--pxs),0 9px 0 0 rgba(59,42,64,.12)}
  .btn.center{justify-content:center}
  .btn.soft{background:#fff;justify-content:center;font-weight:600;font-size:15px;min-height:48px;padding:10px;
            box-shadow:var(--pxs),0 7px 0 0 rgba(59,42,64,.18)}
  .btn.soft > span:last-child{font-family:inherit;font-weight:600;font-size:15px}
  .icon-btn{width:44px;height:44px;background:#fff;border:0;display:flex;align-items:center;justify-content:center;box-shadow:var(--pxs),0 6px 0 rgba(59,42,64,.18);cursor:pointer;flex:none}

  /* sheets */
  .overlay{position:fixed;inset:0;background:rgba(59,42,64,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
  .overlay.show{opacity:1;pointer-events:auto;touch-action:none}
  .sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);background-color:var(--bg);background-image:inherit;border-top:0;box-shadow:0 -3px 0 var(--ink),0 -6px 0 var(--pink);max-height:calc(var(--vvh,100vh) * .94);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
         transform:translateY(105%);visibility:hidden;transition:transform .34s cubic-bezier(.2,1.2,.3,1),visibility 0s .34s;z-index:11}
  .sheet.show{transform:translateY(0);visibility:visible;transition:transform .34s cubic-bezier(.2,1.2,.3,1)}
  .sheet .inner{max-width:560px;margin:0 auto;padding:0 20px 120px}
  /* while the phone keyboard is up, the pay button stops floating so the field being typed in has room */
  body.typing .sheet-bar{position:static}
  body.typing .bar{display:none !important}
  .sheet-bar{position:sticky;bottom:0;padding:12px 3px calc(18px + env(safe-area-inset-bottom));background:var(--bg);margin-top:16px}

  .hero{margin:0 -20px;height:250px;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden;box-shadow:inset 0 -3px 0 var(--ink);
        background-image:linear-gradient(rgba(255,255,255,0) 0 25%,rgba(255,255,255,.2) 25% 50%,rgba(255,255,255,.4) 50% 75%,rgba(255,255,255,.6) 75%)}
  .hero::before,.hero::after{content:"";position:absolute;width:6px;height:6px;background:#fff;opacity:.9;
        box-shadow:0 -6px 0 rgba(255,255,255,.6),0 6px 0 rgba(255,255,255,.6),-6px 0 0 rgba(255,255,255,.6),6px 0 0 rgba(255,255,255,.6);animation:tw 1.6s steps(2,jump-none) infinite}
  .hero::before{top:62px;right:44px}.hero::after{top:120px;left:38px;animation-delay:.8s}
  @keyframes tw{50%{opacity:.25}}
  .hero .back-btn{position:absolute;top:16px;left:23px;z-index:2}
  .back-btn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px 0 12px;background:#fff;border:0;margin:3px;
            box-shadow:var(--pxs),0 7px 0 rgba(59,42,64,.2);cursor:pointer;font-weight:600;font-size:15px;flex:none}
  .back-btn:active{transform:translateY(3px);box-shadow:var(--pxs),0 4px 0 rgba(59,42,64,.2)}
  .title-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:18px}
  .title-row h2{margin:0;font-size:38px;line-height:1}
  .title-row .pr{font-size:34px;color:var(--pink-dark)}

  /* the big bowl on the item screen */
  .hero-bowl{position:relative;width:216px;height:200px;margin-bottom:12px;transform-origin:50% 100%}
  .hero-bowl #cupBody{position:absolute;inset:0;transform-origin:50% 100%}
  .hero-bowl .big{position:absolute;left:0;bottom:0;width:216px;height:168px}
  .bob{animation:bob16 2.4s steps(2,jump-none) infinite}
  @keyframes bob16{50%{transform:translateY(-3px)}}
  #cupBody.wob{animation:wob .4s steps(4,end)}
  @keyframes wob{0%{transform:scale(1,1)}30%{transform:scale(1.06,.92)}60%{transform:scale(.97,1.04)}100%{transform:scale(1,1)}}
  .fw{position:absolute;left:0;top:0;width:0;height:0;transition:transform .4s steps(5,end)}
  .fr{position:absolute;left:-18px;top:-32px;width:36px;height:36px;image-rendering:pixelated;transform-origin:50% 100%;
      transition:transform .42s cubic-bezier(.34,1.9,.5,1),opacity .12s steps(2)}
  .fr.off{transform:translateY(-70px) scale(.6);opacity:0;transition:transform .3s cubic-bezier(.55,-.4,.75,.4),opacity .2s steps(2) .1s}
  .rp{position:absolute;left:-14px;top:-4px;width:28px;height:6px;opacity:0;--pw:2px;--ec:#fff;box-shadow:var(--pxs)}
  .rp.go{animation:ripple .5s steps(4,end)}
  .rp.go.late{animation-delay:.22s}
  @keyframes ripple{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.8);opacity:0}}
  .drz{opacity:0;transition:opacity .35s steps(3,end)}
  .drz.on{opacity:1}
  .fh{position:absolute;left:94px;top:6px;width:28px;height:24px;image-rendering:pixelated;opacity:0;transition:opacity .1s}
  .cup.happy .fh{opacity:1;animation:heartUp .9s steps(6,end) forwards}
  @keyframes heartUp{from{transform:translateY(10px)}to{transform:translateY(-14px)}}

  .box{background:var(--card);padding:14px 16px;margin:16px 3px 0;box-shadow:var(--pxs),0 9px 0 0 rgba(59,42,64,.1)}
  .box h3{margin:0 0 12px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .box h3 small{color:var(--muted);font-weight:500;font-size:13px}
  .req{color:var(--danger)}

  .fchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .fchip{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 10px;cursor:pointer;font-size:14px;line-height:1.2;text-align:left;margin:2px;
         border:0;background:#fff;color:var(--muted);--pw:2px;--ec:var(--lilac);box-shadow:var(--pxs);transition:background .1s steps(2)}
  .fchip .pxi{width:28px;height:28px;opacity:.75}
  .fchip.on{--ec:var(--ink);background:var(--soft);color:var(--ink);font-weight:700;box-shadow:var(--pxs),inset 0 -3px 0 rgba(201,60,99,.18)}
  .fchip.on .pxi{opacity:1}
  .fchip:disabled{opacity:.4;cursor:not-allowed}
  .pop{animation:pop .3s steps(3,end)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(.9)}75%{transform:scale(1.06)}100%{transform:scale(1)}}

  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0}
  .row + .row{border-top:3px dotted var(--line)}
  .row .lbl{font-weight:700;font-size:15px}
  .row .lbl small{display:block;color:var(--muted);font-size:12px;font-weight:500}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:40px;height:40px;border:0;background:var(--soft);font-family:var(--px-font);font-size:29px;font-weight:400;cursor:pointer;margin:2px;
                  box-shadow:var(--pxs),inset 0 -3px 0 rgba(201,60,99,.2)}
  .stepper button:active{transform:translateY(2px)}
  .stepper button:disabled{opacity:.35;cursor:not-allowed}
  .stepper span{min-width:24px;text-align:center;font-family:var(--px-font);font-size:26px;font-weight:400}
  .switch{width:56px;height:30px;border:0;position:relative;cursor:pointer;background:#EADCE0;flex:none;margin:3px;box-shadow:var(--pxs)}
  .switch::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;background:#fff;box-shadow:inset -3px -3px 0 var(--lilac);transition:left .16s steps(3,end)}
  .switch.on{background:var(--pink)}
  .switch.on::after{left:30px;box-shadow:inset -3px -3px 0 rgba(201,60,99,.35)}

  /* cart */
  .ci{display:flex;gap:14px;align-items:flex-start;padding:10px 0}
  .ci + .ci{border-top:3px dotted var(--line)}
  .ci .thumb{width:56px;height:50px;flex:none;display:flex;align-items:center;justify-content:center;margin:3px;--pw:2px;box-shadow:var(--pxs)}
  .ci .thumb .pxi{width:50px;height:auto}
  .ci .info{flex:1;min-width:0}
  .ci .nm{font-family:var(--px-font);font-weight:700;font-size:22px}
  .ci .opt{font-size:12px;color:var(--muted)}
  .ci .pr{font-family:var(--px-font);font-weight:700;font-size:22px;white-space:nowrap}
  .link{background:none;border:0;padding:4px 0;font-size:13px;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;margin-right:16px;font-weight:700}
  .link.del{color:var(--danger)}
  label.f{display:block;font-size:15px;font-weight:700;margin-bottom:8px}
  input,textarea{width:calc(100% - 6px);margin:0 3px;font-size:16px;padding:11px 14px;border:0;border-radius:0;background:#fff;box-shadow:var(--pxs)}
  textarea{resize:none;height:72px;min-height:72px;max-height:72px;overflow-y:auto;line-height:1.4}   /* fixed size: no drag handle to catch by accident */
  input:focus,textarea:focus{outline:none;--ec:var(--pink-dark);background:#FFFBFC}
  .dq-head{font-weight:700;font-size:14px;margin:14px 0 2px;padding-top:10px;border-top:3px dotted var(--line)}
  .rounds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .round{min-height:54px;padding:8px 12px;border:0;background:#fff;text-align:left;margin:2px;--pw:2px;--ec:var(--lilac);box-shadow:var(--pxs);
         display:flex;flex-direction:column;justify-content:center;gap:1px;cursor:pointer}
  .round b{font-weight:700;font-size:15px}
  .round small{font-size:12px;color:var(--muted)}
  .round.on{--ec:var(--ink);background:var(--soft);box-shadow:var(--pxs),inset 0 -3px 0 rgba(201,60,99,.18)}
  .dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:17px;padding-bottom:8px;border-bottom:3px dotted var(--line)}
  .dayhead span{font-weight:500;font-size:13px;color:var(--muted)}
  .days{align-self:stretch;display:flex;flex-direction:column;gap:10px;margin-top:14px;text-align:left}
  .days div{display:flex;align-items:baseline;gap:8px;background:#fff;padding:8px 12px;margin:0 3px;--pw:2px;box-shadow:var(--pxs)}
  .days b{font-weight:700;font-size:15px;white-space:nowrap}
  .days span{flex:1;font-size:12px;color:var(--muted);min-width:0}
  .days em{font-style:normal;font-family:var(--px-font);font-weight:700;font-size:21px}
  .hist-btn{display:flex;align-items:center;gap:10px;width:calc(100% - 6px);margin:16px 3px 0;background:#fff;border:0;padding:10px 14px;
            box-shadow:var(--pxs),0 7px 0 rgba(59,42,64,.16);cursor:pointer;font-weight:700;font-size:15px;text-align:left}
  .hist-btn span{flex:1}
  .hist-btn em{font-style:normal;background:var(--coin);min-width:26px;padding:0 6px;text-align:center;font-family:var(--px-font);font-size:18px;--pw:2px;box-shadow:var(--pxs)}
  .hcard{padding-top:10px}
  .hhead{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:3px dotted var(--line)}
  .hhead b{font-family:var(--px-font);font-weight:700;font-size:25px}
  .hhead span{font-size:12px;color:var(--muted)}
  .hrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0}
  .hrow + .hrow{border-top:3px dotted var(--line)}
  .hrow b{font-weight:700;font-size:15px;display:block}
  .hrow small{display:block;font-size:12px;color:var(--muted)}
  .hrow em{font-style:normal;font-family:var(--px-font);font-weight:700;font-size:22px;white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 2px 2px}
  .chip{font-size:12px;font-weight:700;padding:1px 8px;--pw:2px;box-shadow:var(--pxs)}
  .chip.warn{background:#FFF1C7}.chip.info{background:#E1F0FB}.chip.ok{background:#D8F3E3}.chip.done{background:#ECE6F2}.chip.bad{background:#FFE0E6;color:var(--danger)}
  .hfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:3px dotted var(--line);font-size:13px;color:var(--muted)}
  .mini{border:0;background:#fff;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer;min-height:36px;margin:2px;--pw:2px;box-shadow:var(--pxs),0 4px 0 rgba(59,42,64,.16)}
  .mini:active{transform:translateY(2px)}
  .mini.pink{background:var(--pink)}
  .mini:disabled{opacity:.4;cursor:not-allowed}
  .mini.danger{background:#fff;color:var(--danger);--ec:var(--danger)}
  .mini.armed,.link.armed{background:var(--danger);color:#fff;--ec:var(--danger);text-decoration:none;padding:4px 10px;--pw:2px;box-shadow:var(--pxs)}
  .total{display:flex;justify-content:space-between;align-items:baseline}
  .total span{font-weight:700;font-size:18px}
  .total b{font-family:var(--px-font);font-weight:700;font-size:34px;color:var(--pink-dark)}
  .err{color:var(--danger);font-size:14px;margin-top:12px;display:none;font-weight:700}
  .payopts{display:flex;flex-direction:column;gap:10px}
  .box.need{--ec:var(--pink-dark);box-shadow:var(--pxs),0 9px 0 0 rgba(201,60,99,.18)}
  .box.need .req{color:var(--pink-dark)}
  .box.bump{animation:bump .4s steps(5,end)}
  @keyframes bump{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  @media (prefers-reduced-motion: reduce){.box.bump{animation:none}}
  .payopt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:#fff;text-align:left;cursor:pointer;min-height:60px;margin:2px;--pw:2px;--ec:var(--lilac);box-shadow:var(--pxs)}
  .payopt .dot{width:22px;height:22px;flex:none;position:relative;background:#fff;margin:2px;--pw:2px;--ec:var(--ink);box-shadow:var(--pxs)}
  .payopt.on{--ec:var(--ink);background:var(--soft)}
  .payopt.on .dot::after{content:"";position:absolute;inset:4px;background:var(--pink-dark)}
  .payopt b{display:block;font-weight:700;font-size:15px}
  .payopt small{display:block;font-size:12px;color:var(--muted)}

  /* done */
  .done{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:30px;text-align:center}
  .oid{font-family:var(--px-font);font-weight:700;font-size:29px;background:var(--coin);padding:2px 12px;letter-spacing:1px;--pw:2px;box-shadow:var(--pxs)}
  .paycard{align-self:stretch;background:#fff;padding:18px;margin:20px 3px 0;box-shadow:var(--pxs),0 9px 0 rgba(59,42,64,.12);display:flex;flex-direction:column;gap:14px;text-align:left}
  .qr{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;margin:2px;--pw:2px;--ec:var(--lilac);box-shadow:var(--pxs)}
  .qr .tag{font-size:12px;font-weight:700;color:#fff;background:#113566;padding:3px 10px}
  .qr img{width:200px;height:200px;display:block}
  .or{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
  .or::before,.or::after{content:"";flex:1;height:0;border-top:3px dotted var(--line)}
  .acct{display:flex;align-items:center;gap:12px;background:var(--bg);padding:12px 14px}
  .acct .k{width:40px;height:40px;background:#138F2D;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--px-font);font-weight:700;font-size:26px;flex:none;--pw:2px;box-shadow:var(--pxs)}
  .acct .no{font-family:var(--px-font);font-weight:700;font-size:29px;letter-spacing:.5px}
  .slip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:120px;margin:2px;--pw:2px;--ec:var(--pink-dark);box-shadow:var(--pxs);
        background:#FFF8FA;font-weight:700;cursor:pointer;text-align:center;padding:14px;position:relative}
  .slip input{position:absolute;inset:0;opacity:0;cursor:pointer;box-shadow:none}
  .slip img{max-width:160px;max-height:220px;--pw:2px;box-shadow:var(--pxs)}
  .slip.ok{--ec:var(--ok);background:#E8F7EF;color:#1E6B47}
  .slip.err{color:var(--danger);background:#FFF0F3}
  .later{display:flex;gap:12px;align-items:center;background:var(--bg);padding:14px;text-align:left}
  .later .ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none}
  .banner{display:flex;align-items:center;gap:10px;background:#FFF1C7;border:0;padding:12px 14px;margin:16px 3px 0;width:calc(100% - 6px);text-align:left;cursor:pointer;font-weight:700;font-size:14px;
          box-shadow:var(--pxs),0 7px 0 rgba(59,42,64,.16)}
  .banner span{flex:1}
  .install{display:flex;align-items:center;gap:10px;background:#fff;padding:10px 12px;margin:16px 3px 0;font-size:13px;color:var(--muted);box-shadow:var(--pxs)}
  .install b{color:var(--ink);display:block;font-size:14px}
  .install button{border:0;background:var(--pink);padding:6px 12px;font-weight:700;cursor:pointer;white-space:nowrap;--pw:2px;box-shadow:var(--pxs)}
  .install .x{background:none;box-shadow:none;color:var(--muted);padding:8px;font-size:18px;line-height:1}
  .g-stage{position:relative;align-self:stretch;height:260px;margin:3px;overflow:hidden;box-shadow:var(--pxs);
           background:linear-gradient(#FFB3C7 0 16%,#FFC2D1 16% 32%,#FFD3DE 32% 48%,#FFE3EA 48% 64%,#FFF0F3 64% 80%,#FFF8F9 80%)}
  .g-stage canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  .g-banner{position:absolute;top:16px;left:0;right:0;text-align:center;font-family:'Press Start 2P',monospace;font-size:14px;color:#fff;
            text-shadow:2px 2px 0 #C93C63,4px 4px 0 #4B3A4F;animation:gBlink 1.4s steps(2,jump-none) infinite}
  @keyframes gBlink{0%{opacity:1}50%{opacity:.55}}
  .g-stage.tall{height:300px}
  .g-items{position:absolute;left:0;right:0;top:44px;bottom:34px;display:flex;flex-wrap:nowrap;justify-content:center;align-content:center;align-items:center;gap:4px 10px}
  .g-items.grid2{flex-wrap:wrap;max-width:250px;margin:0 auto}
  .g-item{position:relative;display:flex;flex-direction:column;align-items:center}
  .g-item .spr{animation:gFloat 1.8s cubic-bezier(.45,0,.55,1) infinite alternate}
  @keyframes gFloat{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-10px) rotate(2deg)}}
  .g-item .sh{width:70%;height:6px;border-radius:50%;background:rgba(75,58,79,.18);margin-top:2px;animation:gSh 1.8s cubic-bezier(.45,0,.55,1) infinite alternate}
  @keyframes gSh{to{transform:scale(.72);opacity:.6}}
  .g-name{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--ink);margin-top:3px;white-space:nowrap}
  .g-qty{position:absolute;top:-2px;right:-6px;font-family:'Press Start 2P',monospace;font-size:9px;background:#FF8FAB;color:var(--ink);padding:3px 4px;--pw:2px;box-shadow:var(--pxs)}
  .g-more{align-self:center;font-family:'Press Start 2P',monospace;font-size:11px;background:#fff;padding:8px 6px;--pw:2px;box-shadow:var(--pxs)}
  .g-spark{position:absolute;animation:gTw 1.2s steps(3,jump-none) infinite}
  @keyframes gTw{0%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.5)}}
  .g-pop{position:absolute;font-family:'Press Start 2P',monospace;font-size:10px;color:#C93C63;text-shadow:1px 1px 0 #fff;opacity:0;animation:gRise 2.4s linear infinite}
  @keyframes gRise{0%{transform:translateY(0);opacity:0}10%{opacity:1}80%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
  .g-hud{position:absolute;bottom:10px;left:12px;right:12px;display:flex;align-items:center;font-family:'Press Start 2P',monospace;font-size:9px;color:var(--ink)}
  .g-bar{flex:1;margin:0 8px;height:9px;border:2px solid var(--ink);position:relative;background:#fff}
  .g-bar i{position:absolute;inset:0;width:0;background:linear-gradient(#FF9DB5,#C93C63);animation:gFill 2.6s steps(10,end) forwards}
  @keyframes gFill{to{width:100%}}
  @media (prefers-reduced-motion: reduce){ .g-banner,.g-item .spr,.g-item .sh,.g-spark,.g-pop{animation:none} .g-bar i{animation:none;width:100%} }
  .loading{text-align:center;color:var(--muted);padding:90px 0}
  .loading::before{content:"LOADING";display:block;font-family:var(--arcade);font-size:12px;color:var(--pink-dark);margin-bottom:12px;animation:tw 1s steps(2,jump-none) infinite}
  .spin{display:inline-block;width:6px;height:6px;margin:0 14px 0 2px;background:currentColor;box-shadow:8px 0 0 currentColor,16px 0 0 currentColor;animation:dots 1s steps(3,jump-none) infinite;border:0!important}
  @keyframes dots{0%{opacity:1}50%{opacity:.3}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .tick{animation:bob 1.6s steps(2,jump-none) infinite}
  @media (prefers-reduced-motion: reduce){ .fr,.fr.off,.fw,.drz,.sheet{transition:none} .rp.go,.pop,.tick,#cupBody.wob,.bob,.hero::before,.hero::after,.cup.happy .fh,.loading::before{animation:none} }
</style>

/* one way to talk to the backend, whether the page runs inside Apps Script, on GitHub Pages, or as a demo */
function call(fn, arg){
  return new Promise((resolve, reject) => {
    if (IS_GAS) return google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](arg);
    if (API_URL){
      const action = {getConfig:'config', submitOrder:'order', attachSlip:'slip', myOrders:'history', cancelOrder:'cancel'}[fn];
      const body = fn === 'submitOrder' ? {action, order: arg} : Object.assign({action}, arg || {});
      fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect:'follow'})
        .then(r => r.text().then(t => {
          let j; try { j = JSON.parse(t); } catch(e) {
            console.error('Apps Script reply', r.status, t.slice(0, 500));
            const why = /authoriz|ขออนุญาต|sign in|ลงชื่อเข้าใช้/i.test(t) ? 'ร้านต้องกดอนุญาตสิทธิ์ใน Apps Script ใหม่'
                      : /doPost|not found|ไม่พบ/i.test(t) ? 'Apps Script ยังไม่ได้ Deploy เวอร์ชันล่าสุด'
                      : 'Apps Script ตอบกลับผิดรูปแบบ (' + r.status + ')';
            throw new Error('ส่งไม่สำเร็จ: ' + why);
          }
          return j;
        }), () => { throw new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่'); })
        .then(j => j.ok ? resolve(j.data) : reject(new Error(/unknown action/i.test(j.error || '')
          ? 'ระบบร้านยังไม่ได้อัปเดตเวอร์ชันล่าสุด ลองใหม่ภายหลังนะ' : j.error)))
        .catch(e => reject(e));
      return;
    }
    setTimeout(() => { // demo
      if (fn === 'getConfig') resolve(DEMO_CONFIG);
      else if (fn === 'submitOrder') { const oid = 'G' + (1000 + Math.floor(Math.random() * 9000)); resolve({ orderId: oid, token:'demo', payLater: !!arg.payLater, total: foodTotal(), cups: cupCount(),
        parts: [...new Set(cart.map(it => it.round))].map((rd,k,a) => { const its = cart.filter(it => it.round === rd);
          return { orderId: a.length > 1 ? oid + '-' + (k+1) : oid, round: rd, cups: its.reduce((s,it) => s + it.qty, 0), total: its.reduce((s,it) => s + linePrice(it), 0),
                   summary: its.map(it => menuOf(it.menuId).name + (it.qty > 1 ? ' x' + it.qty : '')).join(', ') }; }),
        bankAccount:C.bankAccount, accountName:C.accountName, bankName:C.bankName }); }
      else if (fn === 'myOrders' || fn === 'cancelOrder') {
        const gone = load('demo_cancel') || [];
        if (fn === 'cancelOrder') { history_().filter(h => h.orderId === arg.orderId).forEach(h => (h.parts || []).forEach(p => { if (!arg.partId || p.orderId === arg.partId) gone.push(p.orderId); })); save('demo_cancel', gone); }
        const out = {__v: 2}; history_().forEach(h => out[h.orderId] = (h.parts || []).map(p => ({ id: p.orderId, round: p.round, total: p.total,
          pay: h.slip ? 'ส่งสลิปแล้ว' : 'ยังไม่จ่าย', status: gone.indexOf(p.orderId) >= 0 ? 'ยกเลิก' : 'ใหม่', slip: !!h.slip }))); resolve(out); }
      else resolve({ orderId: arg.orderId });
    }, 700);
  });
}

const availFruits = () => C.fruits.filter(f => f.available);
function unitPrice(it){ const m = menuOf(it.menuId); let p = m ? m.price : 0;
  Object.keys(it.addons||{}).forEach(id => { const a = addonOf(id); if (a) p += a.price * (it.addons[id]||0); }); return p; }
const linePrice = it => unitPrice(it) * it.qty;

function describe(it){
  const m = menuOf(it.menuId), parts = [];
  if (m.fruitPick > 0){
    const miss = availFruits().map(f => f.name).filter(f => it.fruits.indexOf(f) < 0);
    parts.push(it.fruits.length ? it.fruits.join(' · ') : 'ไม่ใส่ผลไม้');
    if (it.fruits.length && miss.length && m.fruitPick >= availFruits().length) parts.push('ไม่เอา' + miss.join('/'));
  }
  Object.keys(it.addons).forEach(id => { const a = addonOf(id), n = it.addons[id]; if (!a || !n) return;
    parts.push(a.type === 'count' ? '+' + n + ' scoop' : '+' + a.name); });
  return parts.join(' · ');
}
/* pixel icons: one character = one pixel ('#' ink, 'w' white, 'p' pink, 'y' yellow, 'g' green) */
const PXC = {'#':'#3B2A40', w:'#FFFFFF', p:'#FF8FAB', y:'#FFD34E', g:'#06C755', d:'#C93C63'};
function pxSvg(rows, size, style){
  const h = rows.length, w = rows[0].length; let r = '';
  rows.forEach((row,y) => { let x = 0; while (x < w){ const ch = row[x]; let n = 1; while (x + n < w && row[x+n] === ch) n++;
    if (PXC[ch]) r += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${PXC[ch]}"/>`; x += n; } });
  return `<svg width="${size}" height="${Math.round(size * h / w)}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true" style="flex:none${style ? ';' + style : ''}">${r}</svg>`;
}

/* ---------- illustrations (16-bit) ---------- */
const INK = '#4B3A4F';
const BAND = {ORI:'#FFB5C8', BIS:'#E9B27C', ORE:'#8C7B91', BAN:'#FFD98A', NOF:'#BFDDF7'};
const TINT = {ORI:'#FFE3EA', BIS:'#FBE9D7', ORE:'#ECE6F2', BAN:'#FFF0C7', NOF:'#E1F0FB'};
const PASTEL = [['#FFE3EA','#FFB5C8'],['#E1F0FB','#BFDDF7'],['#E4F6E8','#B8E6B5'],['#FFF0C7','#FFD98A'],['#ECE6F2','#C9B6E4'],['#FFE8D6','#FFC29E']];
const hashOf = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const tintOf = m => TINT[m.id] || PASTEL[hashOf(m.id || m.name) % PASTEL.length][0];
const bandOf = m => BAND[m.id] || PASTEL[hashOf(m.id || m.name) % PASTEL.length][1];

/* fruit library — matched by name; anything new falls back to a pastel round fruit.
   Sheet columns "รูปทรง" (ลูกกลม/แว่น/ชิ้นเต๋า/เบอร์รี่) and "สี" (#hex) override the guess. */
const FRUIT_KINDS = [
  [/กล้วย|banana/i,            {shape:'slice', color:'#FFE7A3', inner:'#F2C34E', seeds:'#C99A2E'}],
  [/ไชน์|มัสคัท|องุ่นเขียว|muscat|green grape/i, {shape:'round', color:'#BDEB8D'}],
  [/บลู|blue/i,                {shape:'blue',  color:'#7C8BFF'}],
  [/องุ่น|grape/i,             {shape:'round', color:'#B28DFF'}],
  [/สตรอ|straw/i,              {shape:'berry', color:'#FF7A8A'}],
  [/ราสพ์|ราสเบอร์|rasp/i,     {shape:'berry', color:'#E8507A'}],
  [/แบล็คเบอร์|blackberry/i,   {shape:'round', color:'#6B4F7C'}],
  [/กีวี|kiwi/i,               {shape:'slice', color:'#B5D86A', inner:'#F1F7D2', seeds:INK}],
  [/แก้วมังกร|dragon/i,        {shape:'slice', color:'#FF6FA8', inner:'#FFF7FB', seeds:INK}],
  [/ส้ม|orange|mandarin|tangerine/i, {shape:'citrus', color:'#FFB45C'}],
  [/มะม่วง|mango/i,            {shape:'cube',  color:'#FFC94D'}],
  [/สับปะรด|pineapple/i,       {shape:'cube',  color:'#FFE066'}],
  [/แตงโม|watermelon/i,        {shape:'cube',  color:'#FF8A94'}],
  [/เมลอน|melon|แคนตาลูป/i,    {shape:'cube',  color:'#C8EE9A'}],
  [/มะละกอ|papaya/i,           {shape:'cube',  color:'#FFA766'}],
  [/พีช|peach/i,               {shape:'cube',  color:'#FFC2A3'}],
  [/แอปเปิ้ล|แอปเปิล|apple/i,   {shape:'cube',  color:'#FF9C9C'}],
  [/เชอร์รี่|cherry/i,          {shape:'cherry',color:'#E2384F'}],
  [/ทับทิม|pomegranate/i,      {shape:'seeds', color:'#E2384F'}],
  [/ลิ้นจี่|lychee/i,           {shape:'round', color:'#FFF1EF'}],
  [/ลำไย|longan/i,             {shape:'round', color:'#EAD7B0'}],
  [/เสาวรส|passion/i,          {shape:'slice', color:'#FFD25A', inner:'#FFB13B', seeds:INK}]
];
const SHAPE_TH = {'ลูกกลม':'round', 'แว่น':'slice', 'ชิ้นเต๋า':'cube', 'เบอร์รี่':'berry'};
function fruitLook(f){
  const hit = FRUIT_KINDS.find(k => k[0].test(f.name));
  const look = Object.assign({shape:'round', color: PASTEL[hashOf(f.name) % PASTEL.length][1]}, hit ? hit[1] : {});
  if (SHAPE_TH[f.shape]) look.shape = SHAPE_TH[f.shape];
  if (f.color) { look.color = f.color; if (look.shape === 'slice') look.inner = '#FFFFFF'; }
  return look;
}
// where each available fruit sits: chosen ones spread evenly over the cream (they slide when one leaves),
// unchosen ones keep a spot of their own so they can sink and pop back in place
function fruitSpots(chosen){
  const all = availFruits(), on = all.filter(f => chosen.indexOf(f.name) >= 0), n = on.length;
  return all.map((f,i) => {
    const k = on.indexOf(f), [x,y,s] = k >= 0 ? slotOf(k, n) : slotOf(i, all.length);
    return `translate(${x}px,${y}px) scale(${s})`;
  });
}
function layoutFruits(){ fruitSpots(draft.fruits).forEach((t,i) => { const w = $('fw'+i); if (w) w.style.transform = t; }); }
// fruit spots on the yogurt of the pixel bowl (hero box is 216 x 200, bowl drawn 3x at the bottom)
function slotOf(i, n){
  const t = n <= 1 ? .5 : i / (n - 1);
  return [ (40 + 136 * t).toFixed(1), (128 - 20 * Math.sin(Math.PI * t)).toFixed(1), n > 5 ? .8 : 1 ];
}
/* cup(m, {size, fruits:[names], live:true, syrup:bool}) — the 16-bit bowl.
   live = the big one on the item screen: bowl without fruit + every fruit as a sprite that pops in/out */
const pxImg = (src, w, cls, extra) => `<img class="pxi ${cls || ''}" src="${src}" width="${w}" height="${Math.round(w * 56 / 72)}" alt="" aria-hidden="true" ${extra || ''}>`;
function cup(m, o){
  o = o || {};
  const size = o.size || 104;
  if (!o.live) return pxImg(Game16.bowlURL(m.id, o.fruits || [], false), size, 'bowl');
  const all = availFruits(), pos = fruitSpots(o.fruits || []), bare = m.fruitPick > 0;
  const fr = bare ? all.map((f,i) => `<div class="fw" id="fw${i}" style="transform:${pos[i]}"><span class="rp" id="rp${i}"></span>
      <img class="fr off" id="fr${i}" src="${Game16.fruitURL(fruitLook(f))}" width="36" height="36" alt=""></div>`).join('') : '';
  return `<div class="cup body hero-bowl" id="cupSvg" aria-hidden="true"><div id="cupBody" class="bob">
      ${pxImg(Game16.bowlURL(m.id, [], bare), 216, 'big')}
      ${fr}
      ${pxImg(Game16.drizzleURL(), 216, 'big drz' + (o.syrup ? ' on' : ''), 'id="drz"')}
      <img class="fh" src="${Game16.heartURL()}" width="28" height="24" alt="">
    </div></div>`;
}
const chipIcon = f => `<img class="pxi" src="${Game16.fruitURL(fruitLook(f))}" width="28" height="28" alt="" aria-hidden="true">`;
// the little bowl used as the logo
const happyCup = size => pxImg(Game16.bowlURL('ORI', [], false), size, 'logo-bowl');

/* ---------- main screen ---------- */
function render(){
  const inCart = {}; cart.forEach(it => inCart[it.menuId] = (inCart[it.menuId]||0) + it.qty);
  $('app').innerHTML = `
    <div class="top">
      <div class="logo h">${happyCup(48)}${esc(C.shopName)}</div>
      ${C.salePeriod ? `<div class="pill">รอบส่ง ${esc(C.salePeriod)}</div>` : ''}
    </div>
    <div class="kicker">▶ SELECT YOUR BOWL</div>
    <h1 class="hello">วันนี้กินถ้วยไหนดี~</h1>
    <div class="sub">แตะเมนู เลือกผลไม้ แล้วกดสั่งได้เลย</div>
    ${IS_GAS || API_URL ? '' : '<div class="demo">🧪 UAT · เวอร์ชันทดลอง สั่งได้หลายวันในครั้งเดียว — ไม่ส่งออเดอร์จริง</div>'}
    ${C.open ? '' : `<div class="closed">${esc(C.closedMsg)}</div>`}
    ${load('greek_pending') ? `<button class="banner" onclick="renderDone(load('greek_pending'))">${ICON.qr}<span>ออเดอร์ ${esc(load('greek_pending').orderId)} ยังไม่ได้แนบสลิป</span>แนบเลย →</button>` : ''}
    ${installCard()}
    ${history_().length ? `<button class="hist-btn" onclick="openHistory()">${ICON.receipt}<span>ออเดอร์ของฉัน</span><em>${history_().length}</em></button>` : ''}
    <div class="grid">
      ${C.menu.map(m => `
        <button class="menu ${inCart[m.id]?'in-cart':''}" onclick="openItem('${m.id}')">
          ${inCart[m.id] ? `<span class="badge">${inCart[m.id]}</span>` : ''}
          <div class="art" style="background:${tintOf(m)}">${cup(m, {fruits: availFruits().slice(0, m.fruitPick).map(f => f.name)})}</div>
          <div class="nm h">${esc(m.name)}</div>
          <div class="ds">${esc(m.desc)}</div>
          <div class="prow"><div class="pr h">${baht(m.price)}</div><span class="plus" aria-hidden="true">+</span></div>
        </button>`).join('')}
    </div>`;
  const n = cupCount();
  $('bar').style.display = n ? 'block' : 'none';
  $('barBtn').innerHTML = `<span style="display:flex;align-items:center;gap:10px">${ICON.cart}ตะกร้า · ${n} ถ้วย</span><span>${C.open ? baht(foodTotal()) + ' →' : 'ร้านปิดรับอยู่'}</span>`;
}

/* ---------- item sheet: built once, then updated in place so animations run ---------- */
function openItem(menuId, idx){
  const m = menuOf(menuId);
  editIndex = (idx === undefined) ? -1 : idx;
  draft = editIndex >= 0 ? JSON.parse(JSON.stringify(cart[editIndex]))
        : { menuId, qty:1, addons:{}, fruits: [], round: defaultRound() };   // no fruit picked yet — customer chooses
  if (C.rounds.indexOf(draft.round) < 0) draft.round = defaultRound();
  draft.days = draft.round ? [draft.round] : []; draft.dq = {};
  const fruitsBox = m.fruitPick > 0 ? `
    <div class="box" id="fruitBox">
      <h3><span>เลือกผลไม้ <span class="req">*</span></span><small id="pickInfo"></small></h3>
      <div class="fchips">
        ${availFruits().map((f,i) => `<button class="fchip" id="fc${i}" onclick="toggleFruit(${i})">${chipIcon(f)}${esc(f.name)}</button>`).join('')}
      </div>
    </div>` : '';
  const addons = addonsFor(m).map(a => a.type === 'count' ? `
      <div class="row"><div class="lbl">${esc(a.name)}<small>+${baht(a.price)} ต่อ scoop</small></div>
        <div class="stepper"><button id="ad-${a.id}-m" aria-label="ลด ${esc(a.name)}" onclick="stepAddon('${a.id}',-1)">−</button>
        <span id="ad-${a.id}">0</span><button id="ad-${a.id}-p" aria-label="เพิ่ม ${esc(a.name)}" onclick="stepAddon('${a.id}',1)">+</button></div></div>` : `
      <div class="row"><div class="lbl">${esc(a.name)}<small>+${baht(a.price)}</small></div>
        <button class="switch" id="ad-${a.id}" aria-label="${esc(a.name)}" onclick="stepAddon('${a.id}',0)"></button></div>`).join('');
  $('itemInner').innerHTML = `
    <div class="hero" style="background-color:${tintOf(m)}">
      <button class="back-btn" onclick="closeSheets()">${ICON.back}<span>${editIndex >= 0 ? 'กลับไปตะกร้า' : 'กลับ'}</span></button>
      ${cup(m, {size: 216, live: true, fruits: draft.fruits})}
    </div>
    <div class="title-row"><h2 class="h">${esc(m.name)}</h2><div class="pr h">${baht(m.price)}</div></div>
    ${m.desc ? `<div class="sub">${esc(m.desc)}</div>` : ''}
    ${C.open ? '' : `<div class="closed" id="itemClosed" style="margin-top:12px">${esc(C.closedMsg)}<div style="font-weight:400;font-size:13px;margin-top:4px">ดูเมนูได้ตามสบาย แต่ยังสั่งไม่ได้จนกว่าร้านจะเปิดรอบใหม่</div></div>`}
    ${fruitsBox}
    ${addonsFor(m).length ? `<div class="box" style="padding-top:6px;padding-bottom:6px">${addons}</div>` : ''}
    ${C.rounds.length > 1 ? `<div class="box" id="dayBox"><h3><span>รับวันไหน <span class="req">*</span></span><small>${editIndex >= 0 ? 'ถ้วยนี้' : 'เลือกได้หลายวัน'}</small></h3><div class="rounds">
      ${C.rounds.map((r,i) => `<button class="round" id="rd${i}" onclick="pickItemRound(${i})"><b>${esc(roundLabel(r))}</b>${(C.roundNotes||{})[r] ? `<small>${esc(C.roundNotes[r])}</small>` : ''}</button>`).join('')}
    </div><div id="dayQty"></div></div>` : ''}
    <div class="box" id="qtyBox" style="padding-top:6px;padding-bottom:6px"><div class="row"><div class="lbl">จำนวน<small id="unitTxt"></small></div>
      <div class="stepper"><button id="qm" aria-label="ลดจำนวน" onclick="setQty(-1)">−</button><span id="qv">1</span><button aria-label="เพิ่มจำนวน" onclick="setQty(1)">+</button></div></div></div>
    <div class="sheet-bar"><button class="btn" id="addBtn" onclick="commitItem()"><span id="addLbl"></span><span id="addPrice"></span></button></div>`;
  show('itemSheet');
  refreshItem();
  // fruits pop out of the yogurt one by one when the sheet opens
  availFruits().forEach((f,i) => { if (draft.fruits.indexOf(f.name) >= 0) setTimeout(() => setFruit(i, true, true), 280 + i * 90); });
}
function setFruit(i, on, ripple){
  const g = $('fr'+i); if (!g) return;
  g.classList.toggle('off', !on);
  if (ripple){ const r = $('rp'+i); r.classList.remove('go','late'); r.getBoundingClientRect(); r.classList.add('go'); if (!on) r.classList.add('late'); }
}
function refreshItem(){
  const m = menuOf(draft.menuId);
  if (m.fruitPick > 0){
    const full = draft.fruits.length >= m.fruitPick;
    $('pickInfo').textContent = draft.fruits.length ? `เลือกได้ ${m.fruitPick} · เลือกแล้ว ${draft.fruits.length}` : `แตะเลือกได้สูงสุด ${m.fruitPick} อย่าง`;
    availFruits().forEach((f,i) => { const on = draft.fruits.indexOf(f.name) >= 0, b = $('fc'+i);
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.disabled = !on && full; });
  }
  addonsFor(m).forEach(a => { const n = draft.addons[a.id] || 0, el = $('ad-'+a.id);
    if (a.type === 'count'){ el.textContent = n; $('ad-'+a.id+'-m').disabled = n <= 0; $('ad-'+a.id+'-p').disabled = n >= a.max; }
    else { el.classList.toggle('on', !!n); el.setAttribute('aria-pressed', !!n); }
  });
  const syrup = addonsFor(m).find(a => a.type !== 'count');
  $('drz').classList.toggle('on', !!(syrup && draft.addons[syrup.id]));
  $('qv').textContent = draft.qty; $('qm').disabled = draft.qty <= 1;
  $('unitTxt').textContent = baht(unitPrice(draft)) + ' / ถ้วย';
  const multi = editIndex < 0 && draft.days.length > 1;
  const cupsAll = multi ? draft.days.reduce((t, r) => t + (draft.dq[r] || 1), 0) : draft.qty;
  $('addPrice').textContent = baht(unitPrice(draft) * cupsAll);
  $('qtyBox').style.display = multi ? 'none' : '';
  if ($('dayQty')) $('dayQty').innerHTML = multi ? `<div class="dq-head">จำนวนแต่ละวัน</div>` + draft.days.map(r => `
      <div class="row"><div class="lbl">${esc(roundLabel(r))}<small>${baht(unitPrice(draft))} / ถ้วย</small></div>
        <div class="stepper"><button aria-label="ลด ${esc(r)}" onclick="setDayQty('${esc(r)}',-1)" ${(draft.dq[r] || 1) <= 1 ? 'disabled' : ''}>−</button>
        <span>${draft.dq[r] || 1}</span><button aria-label="เพิ่ม ${esc(r)}" onclick="setDayQty('${esc(r)}',1)">+</button></div></div>`).join('') : '';
  C.rounds.forEach((r,i) => { const b = $('rd'+i), on = editIndex >= 0 ? draft.round === r : draft.days.indexOf(r) >= 0;
    if (b){ b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); } });
  const needFruit = m.fruitPick > 0 && !draft.fruits.length;
  const needDay = C.rounds.length && C.rounds.indexOf(draft.round) < 0;
  $('addBtn').classList.toggle('dim', needFruit || needDay || !C.open);
  if (!C.open){ $('addLbl').textContent = 'ร้านปิดรับอยู่ · ดูได้อย่างเดียว'; need('fruitBox', false); need('dayBox', false); return; }
  need('fruitBox', needFruit); need('dayBox', needDay);
  $('addLbl').textContent = needFruit ? 'เลือกผลไม้ก่อนนะ' : needDay ? 'เลือกวันรับก่อนนะ' : editIndex >= 0 ? 'บันทึก' : multi ? `ใส่ตะกร้า · ${draft.days.length} วัน ${cupsAll} ถ้วย` : 'ใส่ตะกร้า';
}
// a new cup starts on the day picked last time (or the only open day)
function defaultRound(){
  if (C.rounds.length === 1) return C.rounds[0];
  return C.rounds.indexOf(info.lastRound) >= 0 ? info.lastRound : '';
}
function pickItemRound(i){
  const r = C.rounds[i];
  if (editIndex >= 0) { draft.round = r; refreshItem(); return; }
  const k = draft.days.indexOf(r);
  if (k >= 0) draft.days.splice(k, 1); else { draft.days.push(r); draft.dq[r] = draft.dq[r] || draft.qty; }
  draft.days.sort((a, b) => C.rounds.indexOf(a) - C.rounds.indexOf(b));
  draft.round = draft.days[0] || '';
  refreshItem();
}
function setDayQty(r, d){ draft.dq[r] = Math.max(1, Math.min(C.maxCups || 50, (draft.dq[r] || 1) + d)); refreshItem(); }
function toggleFruit(i){
  const name = availFruits()[i].name, k = draft.fruits.indexOf(name), m = menuOf(draft.menuId);
  if (k >= 0) draft.fruits.splice(k,1); else if (draft.fruits.length < m.fruitPick) draft.fruits.push(name); else return;
  const b = $('fc'+i); b.classList.remove('pop'); b.getBoundingClientRect(); b.classList.add('pop');
  setFruit(i, k < 0, true);
  setTimeout(layoutFruits, k < 0 ? 0 : 380);   // others slide over once the removed one has sunk
  cupReact(k < 0);
  refreshItem();
}
// the cup squishes a little, and smiles when a fruit goes in
let happyTimer = 0;
function cupReact(added){
  const body = $('cupBody'), svg = $('cupSvg'); if (!body) return;
  body.classList.remove('wob'); body.getBoundingClientRect(); body.classList.add('wob');
  if (added){ svg.classList.add('happy'); clearTimeout(happyTimer); happyTimer = setTimeout(() => svg.classList.remove('happy'), 900); }
}
function stepAddon(id, d){ const a = addonOf(id), n = draft.addons[id] || 0;
  const v = d === 0 ? (n ? 0 : 1) : Math.max(0, Math.min(a.max, n + d));
  if (v) draft.addons[id] = v; else delete draft.addons[id]; refreshItem(); }
function setQty(d){ draft.qty = Math.max(1, Math.min(C.maxCups || 50, draft.qty + d)); refreshItem(); }
function commitItem(){
  if (!C.open) { bump('itemClosed'); return; }      // closed: look around freely, but nothing goes in the cart
  const needFruit = menuOf(draft.menuId).fruitPick > 0 && !draft.fruits.length;
  const needDay = C.rounds.length && C.rounds.indexOf(draft.round) < 0;
  if (needFruit || needDay){ if (needDay) bump('dayBox', !needFruit); if (needFruit) bump('fruitBox', true); return; }
  info.lastRound = draft.round;
  const clean = x => { const c = JSON.parse(JSON.stringify(x)); delete c.days; delete c.dq; return c; };
  if (editIndex >= 0) cart[editIndex] = clean(draft);
  else if (draft.days.length > 1) draft.days.forEach(r => cart.push(Object.assign(clean(draft), { round: r, qty: draft.dq[r] || 1 })));   // one cart line per day
  else cart.push(clean(draft));
  save('greek_cart', cart); closeSheets({stay: true}); render();
  if (editIndex >= 0) setTimeout(openCart, 260);
}

/* ---------- cart / checkout ---------- */
function openCart(){
  renderCart(); show('cartSheet');
  // re-check the shop (open/closed, days) so a phone left open since earlier can't order into a closed shop
  refreshConfig().then(() => { if (sheetOpen === 'cartSheet') renderCart(); }).catch(() => {});
}
function refreshConfig(){
  return call('getConfig').then(cfg => { if (!IS_GAS) save('greek_cfg', cfg);
    C = cfg; C.addons = C.addons || []; C.rounds = C.rounds || []; C.fruits = C.fruits || [];
    if (!sheetOpen && !document.querySelector('.done')) render(); });
}
function renderCart(){
  if (!cart.length){ closeSheets(); render(); return; }
  cart.forEach(it => { if (C.rounds.indexOf(it.round) < 0) it.round = C.rounds.length === 1 ? C.rounds[0] : (it.round && C.rounds.indexOf(it.round) >= 0 ? it.round : ''); });
  const groups = (C.rounds.length ? C.rounds.concat(['']) : ['']).map(r => ({ r, items: cart.map((it,i) => ({it, i})).filter(x => (x.it.round || '') === r) })).filter(g => g.items.length);
  const itemRow = ({it, i}) => { const m = menuOf(it.menuId); return `
        <div class="ci"><div class="thumb" style="background:${tintOf(m)}">${cup(m, {size:44, fruits: it.fruits, syrup: !!(it.addons && it.addons.HER)})}</div>
          <div class="info"><div class="nm">${esc(m.name)} × ${it.qty}</div>
            <div class="opt">${esc(describe(it)) || '—'}</div>
            <div><button class="link" onclick="editItem(${i})">แก้ไข</button><button class="link del" onclick="removeItem(${i})">ลบ</button></div></div>
          <div class="pr">${baht(linePrice(it))}</div></div>`; };
  $('cartInner').innerHTML = `
    <div style="padding-top:16px"><button class="back-btn" onclick="closeSheets()">${ICON.back}<span>กลับไปเลือกเมนู</span></button></div>
    ${C.open ? '' : `<div class="closed">${esc(C.closedMsg)}<div style="font-weight:400;font-size:13px;margin-top:4px">ของในตะกร้ายังเก็บไว้ให้ เปิดรอบหน้ากดสั่งต่อได้เลย</div></div>`}
    <h2 class="h" style="margin:14px 0 0;font-size:26px">ตะกร้าของคุณ</h2><div class="sub" style="font-size:13px">${cupCount()} ถ้วย · แตะ "แก้ไข" เพื่อเปลี่ยนผลไม้ จำนวน หรือวันรับ</div>
    ${groups.map(g => `<div class="box" style="padding-top:10px">
      <div class="dayhead">${g.r ? `รับวันที่ ${esc(g.r.replace(/^รับ(วันที่)?\s*/, ''))}` : '<span style="color:var(--danger)">ยังไม่ได้เลือกวันรับ — แตะ "แก้ไข"</span>'}

function submit(){
  const err = $('err'), fail = msg => { err.textContent = msg; err.style.display = 'block'; };
  err.style.display = 'none';
  if (!C.open) { fail(C.closedMsg); return; }
  const noName = !info.name.trim(), noPay = info.payLater === null;
  if (noName || noPay){
    fail(noName && noPay ? 'ใส่ชื่อ และเลือกวิธีจ่ายเงินก่อนนะ' : noName ? 'กรุณาใส่ชื่อ' : 'เลือกวิธีจ่ายเงินก่อนนะ');

  }
  if (C.maxCups && cupCount() > C.maxCups) { fail('สั่งได้สูงสุด ' + C.maxCups + ' ถ้วยต่อออเดอร์ ลดจำนวนลง หรือทักร้านถ้าอยากสั่งเยอะนะ'); return; }

  if (cart.some(it => menuOf(it.menuId).fruitPick > 0 && !(it.fruits || []).length)) { fail('มีถ้วยที่ยังไม่ได้เลือกผลไม้ แตะ "แก้ไข" ที่ถ้วยนั้น'); return; }
  if (C.rounds.length && cart.some(it => C.rounds.indexOf(it.round) < 0)) { fail('มีถ้วยที่ยังไม่ได้เลือกวันรับ แตะ "แก้ไข" ที่ถ้วยนั้น'); return; }
  const btn = $('submitBtn'); btn.disabled = true; btn.innerHTML = '<span>กำลังส่งออเดอร์…</span><span class="spin"></span>';
  save('greek_form', {name: info.name});
  const payload = { name: info.name.trim(), note: info.note, payLater: !!info.payLater, items: cart, device: deviceId() };
  const itemsText = cart.map(it => menuOf(it.menuId).name + ' x' + it.qty).join(', ');
  call('submitOrder', payload).then(res => {
    const done = Object.assign({}, res, { name: info.name, itemsText, items: JSON.parse(JSON.stringify(cart)) });
    if (!res.payLater) save('greek_pending', done);         // remember until the slip is in
    save('greek_history', [Object.assign({}, done, { at: Date.now(), items: JSON.parse(JSON.stringify(cart)) })].concat(history_()).slice(0, 30));
    cart = []; save('greek_cart', []); info.note = ''; info.payLater = null;
    closeSheets({stay: true}); renderDone(done);
    setTimeout(() => { try { history.pushState({page:'done'}, ''); } catch(e){} }, 300);
  }).catch(e => { renderCart(); $('err').textContent = (e && e.message) || 'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง'; $('err').style.display = 'block'; });
}

/* ---------- 16-bit "order complete" scene: one clear bowl per menu (shape from the real Original) ---------- */
const Game16 = (() => {

function Grid(w,h){ this.w=w; this.h=h; this.p=new Array(w*h).fill(null); }

function shade(nx,ny,ramp,dither,x,y){
  let v=(-0.55*nx-0.7*ny+0.25*Math.sqrt(Math.max(0,1-nx*nx-ny*ny)))*0.5+0.5;      // 0..1

function ball(g,cx,cy,r,ramp,o){ o=o||{};

    const dx=(x+.5-cx)/r, dy=(y+.5-cy)/r; if(dx*dx+dy*dy>1) continue;

function ell(g,cx,cy,rx,ry,ramp,o){ o=o||{};
  for(let y=Math.floor(cy-ry);y<=cy+ry;y++) for(let x=Math.floor(cx-rx);x<=cx+rx;x++){
    const dx=(x+.5-cx)/rx, dy=(y+.5-cy)/ry; if(dx*dx+dy*dy>1) continue;

function rect(g,x0,y0,x1,y1,c){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) g.set(x,y,typeof c==='function'?c(x,y):c); }

function trap(g,y0,y1,xl0,xr0,xl1,xr1,fill){
  for(let y=y0;y<=y1;y++){ const t=(y-y0)/Math.max(1,y1-y0), l=Math.round(xl0+(xl1-xl0)*t), r=Math.round(xr0+(xr1-xr0)*t);

}
function outline(g,col,selective){
  const add=[];
  for(let y=0;y<g.h;y++) for(let x=0;x<g.w;x++){ if(g.get(x,y)) continue;
    const n=[g.get(x-1,y),g.get(x+1,y),g.get(x,y-1),g.get(x,y+1)].filter(Boolean);
    if(n.length) add.push([x,y, selective? (selective[n[0]]||col) : col]); }

}
function draw(g,canvas,scale){

function wedge(g,x,y,len,wid,ang,ramp,flesh,seed){

  const NAMES = {ORI:'ORIGINAL', BIS:'BISCOFF', ORE:'OREO', BAN:'BANOFFEE', NOF:'PLAIN'};

// shrink the photo on the phone (slips are big), then send it to the shop
function shrink(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1400 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', .85));
    };
    img.onerror = () => reject(new Error('อ่านรูปนี้ไม่ได้ ลองเลือกรูปอื่น'));
    img.src = url;
  });
}

function copyText(v, b){
  const span = b.querySelector('span') || b, done = () => { span.textContent = 'คัดลอกแล้ว ✓'; };
  const fallback = () => {
    const t = document.createElement('textarea'); t.value = v; t.setAttribute('readonly','');
    t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
    try { if (document.execCommand('copy')) done(); else span.textContent = v; } catch(e){ span.textContent = v; }
    document.body.removeChild(t);
  };

}

  if (lockY === null) return;
  Object.assign(document.body.style, { position: '', top: '', left: '', right: '', width: '' });
  window.scrollTo(0, lockY); lockY = null;
}
function show(id){
  lockPage();
  $('overlay').classList.add('show'); $(id).classList.add('show'); $(id).scrollTop = 0;
  const had = !!sheetOpen; sheetOpen = id;
  try { history[had ? 'replaceState' : 'pushState']({sheet: id}, ''); } catch(e){}
}
function hideSheets(){ ['itemSheet','cartSheet','histSheet'].forEach(id => $(id).classList.remove('show')); $('overlay').classList.remove('show'); sheetOpen = null; unlockPage(); }
function closeSheets(opts){
  const toCart = sheetOpen === 'itemSheet' && editIndex >= 0 && !(opts && opts.stay);
  hideSheets();
  if (history.state && history.state.sheet){ ignorePop = true; history.back(); }
  if (toCart) setTimeout(openCart, 260);
}
window.addEventListener('popstate', () => {
  if (ignorePop){ ignorePop = false; return; }
  if (sheetOpen) closeSheets();                                   // phone back button on a sheet
  else if (document.querySelector('.done')) render();             // back from the "ordered" screen
});

/* ---------- boot ---------- */
function boot(cfg){
  C = cfg; C.addons = C.addons || []; C.rounds = C.rounds || []; C.fruits = C.fruits || [];
  cart = (load('greek_cart') || []).filter(it => menuOf(it.menuId));
  const sheetOpen = $('itemSheet').classList.contains('show') || $('cartSheet').classList.contains('show');
  if (!sheetOpen && !document.querySelector('.done')) render();
}
const cached = !IS_GAS && API_URL ? load('greek_cfg') : null;
if (cached) boot(cached);                              // open instantly with last menu…
call('getConfig').then(cfg => { if (!IS_GAS) save('greek_cfg', cfg); boot(cfg); quietSync(); })   // …then refresh from the sheet
  .catch(e => { if (!cached) $('app').innerHTML = '<div class="loading">โหลดเมนูไม่สำเร็จ<br>' + esc(e.message) + '</div>'; });
if ('serviceWorker' in navigator && !IS_GAS && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
// a phone keeps the app open in the background for days: when it comes back, look for a newer version
// and reload only while the customer is not in the middle of something (the cart is saved anyway)
function checkUpdate(){
  if (!window.APP_VER || IS_GAS) return;
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
    v = v.trim();
    if (!v || v === window.APP_VER) return;
    const busy = document.querySelector('.sheet.show') || document.querySelector('.done');
    if (busy) { window.__updLater = true; return; }
    location.reload();
  }).catch(() => {});
}
/* no accidental zoom on iPhone: Safari ignores "user-scalable=no", so block the pinch gesture here.
   Double-tap zoom is already off through CSS touch-action:manipulation (fast taps on + still all count). */
(function noZoom(){
  ['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
})();
/* iPhone (Safari / LINE browser) puts the keyboard OVER the page instead of shrinking it like Android.
   visualViewport tells us how much is still visible: lift the open sheet above the keyboard and keep the field in view. */
(function keyboardFix(){
  const vv = window.visualViewport; if (!vv) return;
  const root = document.documentElement;
  const fit = () => {
    const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    root.style.setProperty('--vvh', vv.height + 'px');
    root.style.setProperty('--kb', kb + 'px');
    document.body.classList.toggle('typing', kb > 80);
  };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit();
  document.addEventListener('focusin', e => {
    const el = e.target; if (!el.matches || !el.matches('input:not([type=file]),textarea')) return;
    setTimeout(() => { fit(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 320);
  });
  document.addEventListener('focusout', () => setTimeout(fit, 120));
  // "done" on the keyboard closes it
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'fName') e.target.blur(); });
})();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checkUpdate(); quietSync(); } });
setTimeout(checkUpdate, 1500);
</script>
